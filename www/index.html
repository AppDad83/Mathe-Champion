        function init3DScene(item) {
            const container = document.getElementById('viewer-canvas-container');
            if (!container) return;

            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            viewerScene = new THREE.Scene();
            viewerScene.background = new THREE.Color(0x0D1B2A);

            // Camera
            viewerCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            viewerCamera.position.set(0, 0, 3);

            // Renderer
            viewerRenderer = new THREE.WebGLRenderer({ antialias: true });
            viewerRenderer.setSize(width, height);
            viewerRenderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(viewerRenderer.domElement);

            // Lights - Helle Beleuchtung für gute Sichtbarkeit
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            viewerScene.add(ambientLight);

            // Haupt-Licht von vorne oben
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
            directionalLight.position.set(1, 2, 2);
            viewerScene.add(directionalLight);

            // Fülllicht von links (golden)
            const fillLight = new THREE.DirectionalLight(0xFFD700, 1.0);
            fillLight.position.set(-2, 1, 1);
            viewerScene.add(fillLight);

            // Fülllicht von rechts
            const fillLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
            fillLight2.position.set(2, 0, 1);
            viewerScene.add(fillLight2);

            // Rücklicht für Konturen
            const backLight = new THREE.DirectionalLight(0xffffff, 0.8);
            backLight.position.set(0, 1, -2);
            viewerScene.add(backLight);

            // Unterlicht für Details
            const bottomLight = new THREE.DirectionalLight(0xffffff, 0.5);
            bottomLight.position.set(0, -2, 1);
            viewerScene.add(bottomLight);

            // Load model
            const loader = new THREE.GLTFLoader();
            loader.load(
                item.model,
                (gltf) => {
                    viewerMesh = gltf.scene;

                    // Transparenz deaktivieren für solid rendering
                    viewerMesh.traverse((child) => {
                        if (child.isMesh && child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(mat => {
                                    mat.transparent = false;
                                    mat.opacity = 1.0;
                                    mat.depthWrite = true;
                                });
                            } else {
                                child.material.transparent = false;
                                child.material.opacity = 1.0;
                                child.material.depthWrite = true;
                            }
                        }
                    });

                    // Center and scale
                    const box = new THREE.Box3().setFromObject(viewerMesh);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2 / maxDim;
                    viewerMesh.scale.setScalar(scale);
                    viewerMesh.position.sub(center.multiplyScalar(scale));

                    viewerScene.add(viewerMesh);
                    setupViewerControls();
                    animate3D();
                },
                undefined,
                (error) => {
                    console.log('GLB load error:', error);
                    showViewerFallback();
                }
            );
        }

        function setupViewerControls() {
            const canvas = viewerRenderer.domElement;

            // Maus-Steuerung
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMouseX = e.clientX;
                previousMouseY = e.clientY;
                autoRotate = false;
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDragging && viewerMesh) {
                    const deltaX = e.clientX - previousMouseX;
                    const deltaY = e.clientY - previousMouseY;
                    viewerMesh.rotation.y += deltaX * 0.01;
                    viewerMesh.rotation.x += deltaY * 0.01;
                    // X-Rotation begrenzen
                    viewerMesh.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, viewerMesh.rotation.x));
                    previousMouseX = e.clientX;
                    previousMouseY = e.clientY;
                }
            });

            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });

            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
            });

            // Mausrad-Zoom
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                cameraDistance += e.deltaY * 0.01;
                cameraDistance = Math.max(1.5, Math.min(6, cameraDistance));
                viewerCamera.position.z = cameraDistance;
            }, { passive: false });

            // Touch-Steuerung
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMouseX = e.touches[0].clientX;
                    previousMouseY = e.touches[0].clientY;
                    autoRotate = false;
                } else if (e.touches.length === 2) {
                    // Pinch-Zoom Start
                    isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    pinchStartDistance = Math.sqrt(dx * dx + dy * dy);
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isDragging && viewerMesh) {
                    const deltaX = e.touches[0].clientX - previousMouseX;
                    const deltaY = e.touches[0].clientY - previousMouseY;
                    viewerMesh.rotation.y += deltaX * 0.01;
                    viewerMesh.rotation.x += deltaY * 0.01;
                    viewerMesh.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, viewerMesh.rotation.x));
                    previousMouseX = e.touches[0].clientX;
                    previousMouseY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    // Pinch-Zoom
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const pinchDistance = Math.sqrt(dx * dx + dy * dy);
                    const delta = pinchStartDistance - pinchDistance;
                    cameraDistance += delta * 0.02;
                    cameraDistance = Math.max(1.5, Math.min(6, cameraDistance));
                    viewerCamera.position.z = cameraDistance;
                    pinchStartDistance = pinchDistance;
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        function animate3D() {
            viewerAnimationId = requestAnimationFrame(animate3D);

            if (viewerMesh && autoRotate) {
                viewerMesh.rotation.y += 0.005;
            }

            viewerRenderer.render(viewerScene, viewerCamera);
        }

        function showViewerFallback() {
            const fallback = document.getElementById('viewer-fallback');
            if (fallback) {
                fallback.style.display = 'block';
            }
        }

        function close3DViewer() {
            if (viewerAnimationId) {
                cancelAnimationFrame(viewerAnimationId);
            }
            viewerScene = null;
            viewerCamera = null;
            viewerRenderer = null;
            viewerMesh = null;
            autoRotate = true;
            cameraDistance = 3;
            document.getElementById('viewer-overlay-container').innerHTML = '';
        }
        window.close3DViewer = close3DViewer;

        // ====== NAVIGATION ======
        function goHome() {
            // Clear exam timer if running
            clearExamTimer();
            renderTopicGrid();
            updateHallBadge();
            showScreen('home-screen');
        }
        window.goHome = goHome;

        function practiceExamWeaknesses() {
            state.highlightWeakTopics = [...state.lastExamWeakTopics];
            goHome();
        }
        window.practiceExamWeaknesses = practiceExamWeaknesses;

        // ====== UTILITIES ======
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getOrdinal(n) {
            return n + '.';
        }

        function getDivisors(n) {
            const divisors = [];
            for (let i = 1; i <= n; i++) {
                if (n % i === 0) divisors.push(i);
            }
            return divisors;
        }

        // ====== TROPHÄENRAUM INTEGRATION ======
        async function copyAssetToSharedFolder(sourcePath, room, filename) {
            try {
                const { Filesystem, Directory } = Capacitor.plugins;
                // Asset aus App-Bundle lesen
                const response = await fetch(sourcePath);
                const blob = await response.blob();
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
                // In gemeinsamen Ordner schreiben
                await Filesystem.writeFile({
                    path: `SophiaSharedAssets/${room}/${filename}`,
                    data: base64,
                    directory: Directory.Documents,
                    recursive: true
                });
            } catch (e) {
                // Fallback: kein Filesystem (z.B. im Browser) – still fail
                console.warn('copyAssetToSharedFolder failed (ok in browser):', e);
            }
        }

        async function exportTrophyToSharedStorage(unlock) {
            try {
                // Assets kopieren
                if (unlock.image) {
                    const imgFilename = unlock.id + '.png';
                    await copyAssetToSharedFolder(unlock.image, unlock.room, imgFilename);
                }
                if (unlock.model) {
                    const modelFilename = unlock.id + '_model.glb';
                    await copyAssetToSharedFolder(unlock.model, unlock.room, modelFilename);
                }

                // Metadaten in Shared Storage schreiben
                let existing = '[]';
                try {
                    const result = await window.Capacitor.Plugins.Preferences.get({ key: 'sophiaTrophies' });
                    existing = result.value || '[]';
                } catch(e) {}

                const trophies = JSON.parse(existing);

                // Duplikat-Check
                if (trophies.find(t => t.id === unlock.id)) return;

                trophies.push({
                    id: unlock.id,
                    room: unlock.room || 'norse',
                    name: unlock.name,
                    subtitle: unlock.subtitle,
                    emoji: unlock.emoji,
                    runeTitle: unlock.runeTitle || null,
                    description: unlock.description,
                    image: unlock.image
                        ? `SophiaSharedAssets/${unlock.room || 'norse'}/${unlock.id}.png`
                        : null,
                    model: unlock.model
                        ? `SophiaSharedAssets/${unlock.room || 'norse'}/${unlock.id}_model.glb`
                        : null,
                    type: unlock.type,
                    pairedWith: unlock.pairedWith || null,
                    fromApp: 'Mathe-Champion',
                    appVersion: '1.0',
                    unlockReason: unlock.unlockReason || '',
                    unlockedAt: new Date().toISOString(),
                    unlockedAtFormatted: new Date().toLocaleDateString('de-DE')
                });

                await window.Capacitor.Plugins.Preferences.set({
                    key: 'sophiaTrophies',
                    value: JSON.stringify(trophies)
                });

                console.log('Trophy exported to Trophäenraum:', unlock.id);
            } catch(e) {
                console.warn('exportTrophyToSharedStorage failed:', e);
            }
        }
    </script>
