        // ====== TOPIC/EXAM START ======
        function startTopic(topicId) {
            state.currentTopic = topics.find(t => t.id === topicId);
            state.isExamMode = false;
            state.questions = generateQuestions(topicId, 10);
            state.currentQuestionIndex = 0;
            state.correctAnswers = 0;
            state.usedQuestions.clear();
            // Reset session state for rage detection
            state.sessionState = {
                consecutiveErrors: 0,
                rageModeTriggered: false
            };
            showScreen('practice-screen');
            renderQuestion();
        }
        window.startTopic = startTopic;

        function startExamMode() {
            state.currentTopic = null;
            state.isExamMode = true;
            state.questions = [];
            state.usedQuestions.clear();
            // Reset exam topic results tracking
            state.examTopicResults = {};
            // Reset session state for rage detection
            state.sessionState = {
                consecutiveErrors: 0,
                rageModeTriggered: false
            };

            // 2 questions per topic, shuffled
            topics.forEach(topic => {
                const qs = generateQuestions(topic.id, 2, true);
                state.questions.push(...qs);
            });

            // Shuffle (Fisher-Yates)
            for (let i = state.questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [state.questions[i], state.questions[j]] = [state.questions[j], state.questions[i]];
            }

            state.currentQuestionIndex = 0;
            state.correctAnswers = 0;
            showScreen('practice-screen');
            renderQuestion();
        }
        window.startExamMode = startExamMode;

        // ====== QUESTION GENERATION ======
        function generateQuestions(topicId, count, isExam = false) {
            const questions = [];
            for (let i = 0; i < count; i++) {
                const isEasy = i < 2; // First 2 are easier
                questions.push(generateQuestion(topicId, isEasy, isExam));
            }
            return questions;
        }

        function generateQuestion(topicId, isEasy = false, isExam = false) {
            const topic = topics.find(t => t.id === topicId);
            // Get difficulty level for this topic (1-3)
            const diffLevel = isExam ? 2 : getDifficultyLevel(topicId);
            let question;
            let attempts = 0;

            do {
                question = createQuestion(topicId, diffLevel);
                attempts++;
            } while (state.usedQuestions.has(question.key) && attempts < 50);

            state.usedQuestions.add(question.key);
            question.topic = topic;
            return question;
        }

        function createQuestion(topicId, diffLevel) {
            switch (topicId) {
                case 'vielfache': return createVielfacheQuestion(diffLevel);
                case 'teiler': return createTeilerQuestion(diffLevel);
                case 'teilbarkeit': return createTeilbarkeitQuestion(diffLevel);
                case 'halbmult': return createHalbMultQuestion(diffLevel);
                case 'halbdiv': return createHalbDivQuestion(diffLevel);
                case 'nearestten': return createNearestTenQuestion(diffLevel);
                case 'nearesthundred': return createNearestHundredQuestion(diffLevel);
                case 'columnadd': return createColumnAddQuestion(diffLevel);
                case 'columnsub': return createColumnSubQuestion(diffLevel);
                case 'vocabulary': return createVocabularyQuestion(diffLevel);
                case 'roughcalc': return createRoughCalcQuestion(diffLevel);
                default: return null;
            }
        }

        // --- Vielfache ---
        // Level 1: Vielfache von 2, 5, 10 bis 50
        // Level 2: Vielfache von 3, 4, 6 bis 100
        // Level 3: Vielfache von 7, 8, 9 bis 100
        function createVielfacheQuestion(diffLevel) {
            const type = Math.random() < 0.5 ? 'position' : 'choice';
            let base, maxPos, maxRange;

            if (diffLevel === 1) {
                base = [2, 5, 10][randInt(0, 2)];
                maxPos = 5;
                maxRange = 50;
            } else if (diffLevel === 2) {
                base = [3, 4, 6][randInt(0, 2)];
                maxPos = 10;
                maxRange = 100;
            } else {
                base = [7, 8, 9][randInt(0, 2)];
                maxPos = 10;
                maxRange = 100;
            }

            if (type === 'position') {
                const position = randInt(1, maxPos);
                const answer = base * position;
                const ordinal = getOrdinal(position);
                return {
                    key: `vielfache-pos-${base}-${position}`,
                    text: `Nenne das ${ordinal} Vielfache von ${base}`,
                    type: 'numpad',
                    answer: answer,
                    hint1: 'Vielfache entstehen durch Multiplikation.',
                    hint2: `${position}. Vielfache von ${base} = ${position} × ${base} = ${answer}`,
                    explanation: `Das ${ordinal} Vielfache von ${base} ist ${position} × ${base} = ${answer}`
                };
            } else {
                const correctCount = 2;
                const multiples = [];
                const nonMultiples = [];

                for (let i = 1; i <= 12; i++) {
                    if (base * i <= maxRange) multiples.push(base * i);
                }

                for (let i = 1; i <= maxRange; i++) {
                    if (i % base !== 0) nonMultiples.push(i);
                }

                shuffle(multiples);
                shuffle(nonMultiples);

                const correctAnswers = multiples.slice(0, correctCount);
                const wrongAnswers = nonMultiples.slice(0, 4 - correctCount);
                const options = shuffle([...correctAnswers, ...wrongAnswers]);

                return {
                    key: `vielfache-choice-${base}-${options.join('-')}`,
                    text: `Welche Zahlen sind Vielfache von ${base}?`,
                    type: 'multichoice',
                    options: options,
                    correctOptions: correctAnswers,
                    hint1: 'Vielfache können durch die Zahl geteilt werden.',
                    hint2: `Prüfe: Ist die Zahl durch ${base} teilbar?`,
                    explanation: `Die Vielfachen von ${base} sind: ${correctAnswers.join(', ')}`
                };
            }
        }

        // --- Teiler ---
        // Level 1: Teiler von Zahlen bis 30
        // Level 2: Teiler von Zahlen bis 60
        // Level 3: Teiler von Zahlen bis 100
        function createTeilerQuestion(diffLevel) {
            const type = Math.random() < 0.5 ? 'count' : 'choice';
            let number;
            if (diffLevel === 1) {
                number = [6, 8, 10, 12, 15, 18, 20, 24][randInt(0, 7)];
            } else if (diffLevel === 2) {
                number = randInt(20, 60);
            } else {
                number = randInt(40, 100);
            }
            const divisors = getDivisors(number);

            if (type === 'count') {
                return {
                    key: `teiler-count-${number}`,
                    text: `Wie viele Teiler hat ${number}?`,
                    type: 'numpad',
                    answer: divisors.length,
                    hint1: 'Teiler teilen die Zahl ohne Rest.',
                    hint2: `Teiler von ${number}: ${divisors.join(', ')}`,
                    explanation: `${number} hat ${divisors.length} Teiler: ${divisors.join(', ')}`
                };
            } else {
                const correctCount = 2;
                const nonDivisors = [];

                for (let i = 2; i <= 20; i++) {
                    if (number % i !== 0) nonDivisors.push(i);
                }

                shuffle(nonDivisors);
                const correctAnswers = divisors.filter(d => d > 1 && d < number).slice(0, correctCount);
                if (correctAnswers.length < correctCount) {
                    correctAnswers.push(...divisors.slice(0, correctCount - correctAnswers.length));
                }
                const wrongAnswers = nonDivisors.slice(0, 4 - correctAnswers.length);
                const options = shuffle([...correctAnswers, ...wrongAnswers]);

                return {
                    key: `teiler-choice-${number}-${options.join('-')}`,
                    text: `Welche Zahlen sind Teiler von ${number}?`,
                    type: 'multichoice',
                    options: options,
                    correctOptions: correctAnswers,
                    hint1: 'Teiler teilen die Zahl ohne Rest.',
                    hint2: `Probiere: ${number} ÷ Zahl = ?`,
                    explanation: `Die Teiler von ${number} in den Optionen sind: ${correctAnswers.join(', ')}`
                };
            }
        }

        // --- Teilbarkeit ---
        // Level 1: Nur Regeln für 2, 5, 10
        // Level 2: Regeln für 2, 5, 10 gemischt mit Grenzfällen
        // Level 3: Alle Regeln + Kombinations-Fragen
        function createTeilbarkeitQuestion(diffLevel) {
            const type = Math.random() < 0.5 ? 'yesno' : 'multiselect';

            if (type === 'yesno') {
                let divisors, minNum, maxNum;
                if (diffLevel === 1) {
                    divisors = [2, 5, 10];
                    minNum = 10;
                    maxNum = 99;
                } else if (diffLevel === 2) {
                    divisors = [2, 5, 10];
                    minNum = 100;
                    maxNum = 999;
                } else {
                    divisors = [2, 3, 4, 5, 6, 9, 10];
                    minNum = 100;
                    maxNum = 999;
                }

                const divisor = divisors[randInt(0, divisors.length - 1)];
                let number;
                const shouldBeDivisible = Math.random() < 0.5;

                if (shouldBeDivisible) {
                    number = divisor * randInt(Math.ceil(minNum / divisor), Math.floor(maxNum / divisor));
                } else {
                    do {
                        number = randInt(minNum, maxNum);
                    } while (number % divisor === 0);
                }

                const answer = number % divisor === 0;
                let rule = '';
                if (divisor === 2) rule = 'Eine Zahl ist durch 2 teilbar, wenn die letzte Ziffer gerade ist (0, 2, 4, 6, 8).';
                if (divisor === 3) rule = 'Eine Zahl ist durch 3 teilbar, wenn die Quersumme durch 3 teilbar ist.';
                if (divisor === 4) rule = 'Eine Zahl ist durch 4 teilbar, wenn die letzten zwei Ziffern durch 4 teilbar sind.';
                if (divisor === 5) rule = 'Eine Zahl ist durch 5 teilbar, wenn die letzte Ziffer 0 oder 5 ist.';
                if (divisor === 6) rule = 'Eine Zahl ist durch 6 teilbar, wenn sie durch 2 und 3 teilbar ist.';
                if (divisor === 9) rule = 'Eine Zahl ist durch 9 teilbar, wenn die Quersumme durch 9 teilbar ist.';
                if (divisor === 10) rule = 'Eine Zahl ist durch 10 teilbar, wenn die letzte Ziffer 0 ist.';

                return {
                    key: `teilbar-yesno-${number}-${divisor}`,
                    text: `Ist ${number} durch ${divisor} teilbar?`,
                    type: 'yesno',
                    answer: answer,
                    hint1: rule,
                    hint2: `Letzte Ziffer von ${number} ist ${number % 10}. ${answer ? 'Ja!' : 'Nein!'}`,
                    explanation: `${number} ${answer ? 'ist' : 'ist nicht'} durch ${divisor} teilbar. ${rule}`
                };
            } else {
                let options;
                if (diffLevel === 3) {
                    options = [2, 3, 5, 9, 10];
                } else {
                    options = [2, 5, 10];
                }
                const number = randInt(10, 50) * 10; // Divisible by 10
                const divisibleBy = options.filter(d => number % d === 0);

                return {
                    key: `teilbar-multi-${number}`,
                    text: `Durch welche Zahlen ist ${number} teilbar?`,
                    type: 'multiselect',
                    options: options,
                    correctOptions: divisibleBy,
                    hint1: 'Prüfe die Teilbarkeitsregeln.',
                    hint2: `Letzte Ziffer: ${number % 10}`,
                    explanation: `${number} ist teilbar durch: ${divisibleBy.join(', ')}`
                };
            }
        }

        // --- Halbschriftliche Multiplikation ---
        // Level 1: Faktor 1 aus {2, 3, 4, 5}, Faktor 2 zwischen 12-29
        // Level 2: Faktor 1 aus {4, 5, 6, 7}, Faktor 2 zwischen 20-49
        // Level 3: Faktor 1 aus {6, 7, 8, 9}, Faktor 2 zwischen 50-99
        function createHalbMultQuestion(diffLevel) {
            let a, b;
            if (diffLevel === 1) {
                a = randInt(12, 29);
                b = [2, 3, 4, 5][randInt(0, 3)];
            } else if (diffLevel === 2) {
                a = randInt(20, 49);
                b = [4, 5, 6, 7][randInt(0, 3)];
            } else {
                a = randInt(50, 99);
                b = [6, 7, 8, 9][randInt(0, 3)];
            }

            const answer = a * b;
            const tens = Math.floor(a / 10) * 10;
            const ones = a % 10;

            const hint2 = `${a} × ${b} = (${tens} × ${b}) + (${ones} × ${b}) = ${tens * b} + ${ones * b} = ${answer}`;
            const explanation = `${a} × ${b} = (${tens} × ${b}) + (${ones} × ${b}) = ${tens * b} + ${ones * b} = ${answer}`;

            return {
                key: `halbmult-${a}-${b}`,
                text: `${a} × ${b} = ?`,
                type: 'numpad',
                answer: answer,
                hasScratchPad: true,
                hint1: 'Zerlege die größere Zahl in Zehner und Einer.',
                hint2: hint2,
                explanation: explanation
            };
        }

        // --- Halbschriftliche Division ---
        function createHalbDivQuestion(diffLevel) {
            let a, b, answer, remainder;

            if (diffLevel === 1) {
                // Level 1: 2-stellig ÷ 1-stellig, glatt (48 ÷ 6)
                b = randInt(2, 6);
                answer = randInt(10, 19);
                a = answer * b;
            } else if (diffLevel === 2) {
                // Level 2: 3-stellig ÷ 1-stellig, glatt (144 ÷ 6)
                b = randInt(3, 9);
                answer = randInt(20, 99);
                a = answer * b;
            } else {
                // Level 3: 3-stellig ÷ 1-stellig, mit Rest (157 ÷ 6)
                b = randInt(3, 9);
                answer = randInt(20, 99);
                remainder = randInt(1, b - 1);
                a = answer * b + remainder;
            }

            const tens = Math.floor(a / 10) * 10;
            let tensResult = Math.floor(tens / b);
            let onesResult = answer - tensResult;
            let tensUsed = tensResult * b;
            let onesUsed = onesResult * b;

            if (diffLevel === 3) {
                return {
                    key: `halbdiv-${a}-${b}`,
                    text: `${a} ÷ ${b} = ? Rest ?`,
                    type: 'numpad',
                    answer: answer,
                    remainder: remainder,
                    hasScratchPad: true,
                    hint1: 'Zerlege die Zahl in einfachere Teile. Vergiss den Rest nicht!',
                    hint2: `${a} ÷ ${b} = ${answer} Rest ${remainder}`,
                    explanation: `${a} ÷ ${b} = ${answer} Rest ${remainder} (${answer} × ${b} = ${answer * b}, dann ${a} - ${answer * b} = ${remainder})`
                };
            }

            return {
                key: `halbdiv-${a}-${b}`,
                text: `${a} ÷ ${b} = ?`,
                type: 'numpad',
                answer: answer,
                hasScratchPad: true,
                hint1: 'Zerlege die Zahl in einfachere Teile.',
                hint2: `${a} ÷ ${b} = (${tensUsed} ÷ ${b}) + (${onesUsed} ÷ ${b}) = ${tensResult} + ${onesResult} = ${answer}`,
                explanation: `${a} ÷ ${b} = ${answer}`
            };
        }

        // --- Nearest Ten (Addition) ---
        function createNearestTenQuestion(diffLevel) {
            let base, addend;

            if (diffLevel === 1) {
                // Level 1: 2-stellig + 1-stellig nahe 10 (45 + 9)
                base = randInt(20, 90);
                addend = [8, 9][randInt(0, 1)];
            } else if (diffLevel === 2) {
                // Level 2: 3-stellig + 2-stellig nahe 10 (234 + 18)
                base = randInt(100, 500);
                addend = [8, 9, 18, 19][randInt(0, 3)];
            } else {
                // Level 3: 3-stellig + 3-stellig nahe 10 (456 + 198)
                base = randInt(200, 800);
                addend = [98, 99, 198, 199][randInt(0, 3)];
            }

            const roundedAddend = Math.ceil(addend / 10) * 10;
            const adjustment = roundedAddend - addend;
            const answer = base + addend;

            return {
                key: `nearestten-${base}-${addend}`,
                text: `${base} + ${addend} = ?`,
                type: 'numpad',
                answer: answer,
                hasScratchPad: true,
                hint1: 'Runde die zweite Zahl auf den nächsten Zehner auf.',
                hint2: `Schritt 1: Runde ${addend} auf zu ${roundedAddend} (+${adjustment})\nSchritt 2: ${base} + ${roundedAddend} = ${base + roundedAddend}\nSchritt 3: ${base + roundedAddend} - ${adjustment} = ${answer}`,
                explanation: `${base} + ${addend} = ${base} + ${roundedAddend} - ${adjustment} = ${base + roundedAddend} - ${adjustment} = ${answer}`
            };
        }

        // --- Nearest Hundred (Subtraction) ---
        function createNearestHundredQuestion(diffLevel) {
            let base, subtrahend;

            if (diffLevel === 1) {
                // Level 1: 3-stellig − nahe 100 (456 - 98)
                base = randInt(200, 600);
                subtrahend = [98, 99][randInt(0, 1)];
            } else if (diffLevel === 2) {
                // Level 2: 4-stellig − nahe 100 (1234 - 99)
                base = randInt(500, 1500);
                subtrahend = [98, 99, 198, 199][randInt(0, 3)];
            } else {
                // Level 3: 4-stellig − nahe 200/300 (1567 - 298)
                base = randInt(800, 2000);
                subtrahend = [198, 199, 298, 299][randInt(0, 3)];
            }

            const roundedSub = Math.ceil(subtrahend / 100) * 100;
            const adjustment = roundedSub - subtrahend;
            const answer = base - subtrahend;

            if (answer < 0) return createNearestHundredQuestion(diffLevel);

            return {
                key: `nearesthundred-${base}-${subtrahend}`,
                text: `${base} − ${subtrahend} = ?`,
                type: 'numpad',
                answer: answer,
                hasScratchPad: true,
                hint1: 'Runde den Subtrahenden auf den nächsten Hunderter auf.',
                hint2: `Schritt 1: Runde ${subtrahend} auf zu ${roundedSub}\nSchritt 2: ${base} - ${roundedSub} = ${base - roundedSub}\nSchritt 3: Addiere ${adjustment} zurück: ${base - roundedSub} + ${adjustment} = ${answer}`,
                explanation: `${base} - ${subtrahend} = ${base} - ${roundedSub} + ${adjustment} = ${answer}`
            };
        }

        // --- Column Addition ---
        function createColumnAddQuestion(diffLevel) {
            let a, b, c;
            const useThreeSummands = diffLevel === 3 && Math.random() < 0.4;

            if (diffLevel === 1) {
                // Level 1: 2-stellig + 2-stellig (45 + 38)
                a = randInt(20, 80);
                b = randInt(20, 80);
            } else if (diffLevel === 2) {
                // Level 2: 3-stellig + 3-stellig (345 + 278)
                a = randInt(100, 600);
                b = randInt(100, 600);
            } else {
                // Level 3: 4-stellig + 3-stellig (1234 + 567) or 3 summands
                if (useThreeSummands) {
                    a = randInt(100, 400);
                    b = randInt(100, 400);
                    c = randInt(100, 400);
                    while (a + b + c >= 1500) {
                        a = randInt(100, 350);
                        b = randInt(100, 350);
                        c = randInt(100, 350);
                    }
                } else {
                    a = randInt(1000, 5000);
                    b = randInt(100, 900);
                }
            }

            // Ensure there's at least one carry operation for challenge
            if (!useThreeSummands && diffLevel >= 2) {
                const ones = (a % 10) + (b % 10);
                const tens = (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10);
                if (ones < 10 && tens < 10) {
                    a += 5;
                }
            }

            const answer = useThreeSummands ? a + b + c : a + b;

            if (useThreeSummands) {
                return {
                    key: `columnadd-${a}-${b}-${c}`,
                    text: 'Addiere diese Zahlen:',
                    type: 'numpad',
                    answer: answer,
                    columnLayout: { a, b, c, operation: '+' },
                    hasScratchPad: true,
                    hasHTOGrid: true,
                    hint1: 'Addiere jede Spalte von rechts nach links. Übertrag nicht vergessen!',
                    hint2: `H: ${Math.floor(a/100)} + ${Math.floor(b/100)} + ${Math.floor(c/100)}, Z: ${Math.floor(a/10)%10} + ${Math.floor(b/10)%10} + ${Math.floor(c/10)%10}, E: ${a%10} + ${b%10} + ${c%10}`,
                    explanation: `${a} + ${b} + ${c} = ${answer}`
                };
            }

            return {
                key: `columnadd-${a}-${b}`,
                text: 'Addiere diese Zahlen:',
                type: 'numpad',
                answer: answer,
                columnLayout: { a, b, operation: '+' },
                hasScratchPad: true,
                hasHTOGrid: true,
                hint1: 'Addiere jede Spalte von rechts nach links. Übertrag nicht vergessen!',
                hint2: diffLevel === 3 ?
                    `T: ${Math.floor(a/1000)} + 0, H: ${Math.floor(a/100)%10} + ${Math.floor(b/100)}, Z: ${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}, E: ${a%10} + ${b%10}` :
                    `H: ${Math.floor(a/100)} + ${Math.floor(b/100)}, Z: ${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}, E: ${a%10} + ${b%10}`,
                explanation: `${a} + ${b} = ${answer}`
            };
        }

        // --- Column Subtraction ---
        function createColumnSubQuestion(diffLevel) {
            let a, b;

            if (diffLevel === 1) {
                // Level 1: 2-stellig - 2-stellig (75 - 38)
                a = randInt(50, 99);
                b = randInt(20, 49);
            } else if (diffLevel === 2) {
                // Level 2: 3-stellig - 2-stellig (456 - 78)
                a = randInt(200, 700);
                b = randInt(30, 99);
            } else {
                // Level 3: 3-stellig - 3-stellig (654 - 287)
                a = randInt(400, 999);
                b = randInt(100, 400);
            }

            if (b >= a) {
                [a, b] = [b + 50, a];
            }

            // Ensure there's at least one borrow operation for challenge
            if (diffLevel >= 2 && (a % 10) >= (b % 10) && (Math.floor(a/10) % 10) >= (Math.floor(b/10) % 10)) {
                b = b + 5;
                if (b >= a) a = b + 50;
            }

            const answer = a - b;

            return {
                key: `columnsub-${a}-${b}`,
                text: 'Subtrahiere diese Zahlen:',
                type: 'numpad',
                answer: answer,
                columnLayout: { a, b, operation: '−' },
                hasScratchPad: true,
                hasHTOGrid: true,
                hint1: 'Subtrahiere jede Spalte von rechts nach links. Entbündeln wenn nötig!',
                hint2: `Wenn die obere Ziffer kleiner ist, entbündele von der nächsten Spalte.`,
                explanation: `${a} - ${b} = ${answer}`
            };
        }

        // --- Math Vocabulary ---
        function createVocabularyQuestion(diffLevel) {
            let types, type;

            if (diffLevel === 1) {
                // Level 1: Basic terms (Differenz, Summe, Halbieren)
                types = ['difference', 'sum', 'halve'];
            } else if (diffLevel === 2) {
                // Level 2: Extended terms (+ Verdoppeln, Produkt)
                types = ['difference', 'sum', 'halve', 'double', 'product'];
            } else {
                // Level 3: All terms + word problems
                types = ['difference', 'sum', 'halve', 'double', 'product', 'wordproblem'];
            }

            type = types[randInt(0, types.length - 1)];

            let a, b, answer, text, keyword;

            if (type === 'difference') {
                a = diffLevel === 1 ? randInt(30, 80) : randInt(50, 200);
                b = diffLevel === 1 ? randInt(10, 29) : randInt(20, 100);
                if (b >= a) [a, b] = [b + 20, a];
                answer = a - b;
                keyword = 'DIFFERENZ';
                text = `Wie groß ist die <span class="keyword">${keyword}</span> von ${a} und ${b}?`;
            } else if (type === 'sum') {
                a = diffLevel === 1 ? randInt(50, 150) : randInt(100, 500);
                b = diffLevel === 1 ? randInt(50, 150) : randInt(100, 500);
                answer = a + b;
                keyword = 'SUMME';
                text = `Wie groß ist die <span class="keyword">${keyword}</span> von ${a} und ${b}?`;
            } else if (type === 'halve') {
                a = (diffLevel === 1 ? randInt(20, 50) : randInt(50, 150)) * 2;
                answer = a / 2;
                keyword = 'HALBIERE';
                text = `<span class="keyword">${keyword}</span> ${a}`;
            } else if (type === 'double') {
                a = diffLevel === 2 ? randInt(30, 150) : randInt(100, 400);
                answer = a * 2;
                keyword = 'VERDOPPELE';
                text = `<span class="keyword">${keyword}</span> ${a}`;
            } else if (type === 'product') {
                a = randInt(5, 12);
                b = randInt(5, 12);
                answer = a * b;
                keyword = 'PRODUKT';
                text = `Wie groß ist das <span class="keyword">${keyword}</span> von ${a} und ${b}?`;
            } else {
                // Word problems
                const problems = [
                    { text: `Lisa hat ${a = randInt(50, 100)} Murmeln. Sie schenkt ${b = randInt(10, 30)} davon ihrer Freundin. Wie viele hat sie noch?`, answer: a - b, keyword: 'DIFFERENZ' },
                    { text: `Ein Buch kostet ${a = randInt(10, 25)} €. Max kauft ${b = randInt(2, 5)} Bücher. Wie viel zahlt er insgesamt?`, answer: a * b, keyword: 'PRODUKT' },
                    { text: `${a = randInt(40, 80) * 2} Kinder werden gleichmäßig auf 2 Gruppen verteilt. Wie viele sind in jeder Gruppe?`, answer: a / 2, keyword: 'HALBIERE' }
                ];
                const prob = problems[randInt(0, 2)];
                text = prob.text;
                answer = prob.answer;
                keyword = prob.keyword;
            }

            let explanation;
            if (type === 'difference') {
                explanation = `DIFFERENZ bedeutet subtrahieren: ${a} - ${b} = ${answer}`;
            } else if (type === 'sum') {
                explanation = `SUMME bedeutet addieren: ${a} + ${b} = ${answer}`;
            } else if (type === 'halve') {
                explanation = `HALBIEREN bedeutet durch 2 teilen: ${a} ÷ 2 = ${answer}`;
            } else if (type === 'double') {
                explanation = `VERDOPPELN bedeutet mal 2: ${a} × 2 = ${answer}`;
            } else if (type === 'product') {
                explanation = `PRODUKT bedeutet multiplizieren: ${a} × ${b} = ${answer}`;
            } else {
                explanation = `Textaufgabe: ${keyword} = ${answer}`;
            }

            return {
                key: `vocab-${type}-${a}-${b || ''}`,
                text: text,
                type: 'numpad',
                answer: answer,
                hint1: `${keyword} ist ein mathematischer Fachbegriff.`,
                hint2: type === 'difference' ? 'DIFFERENZ = Subtraktion' :
                       type === 'sum' ? 'SUMME = Addition' :
                       type === 'halve' ? 'HALBIEREN = durch 2 teilen' :
                       type === 'double' ? 'VERDOPPELN = mal 2' :
                       type === 'product' ? 'PRODUKT = Multiplikation' :
                       'Lies die Aufgabe genau und überlege, welche Rechenart gebraucht wird.',
                explanation: explanation
            };
        }

        // --- Rough Calculation ---
        function createRoughCalcQuestion(diffLevel) {
            let types, type;
            const roundToTen = (n) => Math.round(n / 10) * 10;
            const roundToHundred = (n) => Math.round(n / 100) * 100;

            if (diffLevel === 1) {
                // Level 1: Round to tens, addition only (47 + 28 ≈ 80)
                types = ['addition'];
            } else if (diffLevel === 2) {
                // Level 2: Round to tens, subtraction included (156 - 48 ≈ 110)
                types = ['addition', 'subtraction'];
            } else {
                // Level 3: Round to hundreds, mixed operations (456 + 378 ≈ 800)
                types = ['additionHundred', 'subtractionHundred', 'threeSummands'];
            }

            type = types[randInt(0, types.length - 1)];

            let a, b, c, answer, roundedAnswer, text, hint2, tolerance;

            if (type === 'addition') {
                a = diffLevel === 1 ? randInt(20, 80) : randInt(100, 500);
                b = diffLevel === 1 ? randInt(20, 80) : randInt(100, 400);
                roundedAnswer = roundToTen(a) + roundToTen(b);
                text = `Überschlage: ${a} + ${b} ≈ ?`;
                hint2 = `${a} ≈ ${roundToTen(a)}, ${b} ≈ ${roundToTen(b)}\n${roundToTen(a)} + ${roundToTen(b)} = ${roundedAnswer}`;
                answer = roundedAnswer;
                tolerance = 10;
            } else if (type === 'subtraction') {
                a = randInt(150, 500);
                b = randInt(30, 150);
                if (b >= a) [a, b] = [a + 200, b];
                roundedAnswer = roundToTen(a) - roundToTen(b);
                text = `Überschlage: ${a} − ${b} ≈ ?`;
                hint2 = `${a} ≈ ${roundToTen(a)}, ${b} ≈ ${roundToTen(b)}\n${roundToTen(a)} − ${roundToTen(b)} = ${roundedAnswer}`;
                answer = roundedAnswer;
                tolerance = 10;
            } else if (type === 'additionHundred') {
                a = randInt(200, 700);
                b = randInt(200, 700);
                roundedAnswer = roundToHundred(a) + roundToHundred(b);
                text = `Überschlage: ${a} + ${b} ≈ ?`;
                hint2 = `${a} ≈ ${roundToHundred(a)}, ${b} ≈ ${roundToHundred(b)}\n${roundToHundred(a)} + ${roundToHundred(b)} = ${roundedAnswer}`;
                answer = roundedAnswer;
                tolerance = 100;
            } else if (type === 'subtractionHundred') {
                a = randInt(500, 999);
                b = randInt(100, 400);
                if (b >= a) [a, b] = [a + 300, b];
                roundedAnswer = roundToHundred(a) - roundToHundred(b);
                text = `Überschlage: ${a} − ${b} ≈ ?`;
                hint2 = `${a} ≈ ${roundToHundred(a)}, ${b} ≈ ${roundToHundred(b)}\n${roundToHundred(a)} − ${roundToHundred(b)} = ${roundedAnswer}`;
                answer = roundedAnswer;
                tolerance = 100;
            } else {
                // threeSummands with hundred rounding
                a = randInt(200, 500);
                b = randInt(200, 500);
                c = randInt(200, 400);
                roundedAnswer = roundToHundred(a) + roundToHundred(b) + roundToHundred(c);
                text = `Überschlage: ${a} + ${b} + ${c} ≈ ?`;
                hint2 = `${a} ≈ ${roundToHundred(a)}, ${b} ≈ ${roundToHundred(b)}, ${c} ≈ ${roundToHundred(c)}\n${roundToHundred(a)} + ${roundToHundred(b)} + ${roundToHundred(c)} = ${roundedAnswer}`;
                answer = roundedAnswer;
                tolerance = 100;
            }

            return {
                key: `roughcalc-${type}-${a}-${b}-${c || ''}`,
                text: text,
                type: 'numpad',
                answer: answer,
                tolerance: tolerance,
                hasScratchPad: true,
                hint1: diffLevel < 3 ? 'Runde jede Zahl zuerst auf den nächsten Zehner.' : 'Runde jede Zahl auf den nächsten Hunderter.',
                hint2: hint2,
                explanation: `Überschlag: ${hint2.split('\n')[0]}\nErgebnis: ${answer}`
            };
        }

        // ====== QUESTION RENDERING ======
        function renderQuestion() {
            const q = state.questions[state.currentQuestionIndex];
            state.attempts = 0;
            state.hintLevel = 0;

            // Clear any existing timer
            clearExamTimer();

            const total = state.questions.length;
            const current = state.currentQuestionIndex + 1;
            document.getElementById('progress-text').textContent = `Aufgabe ${current} von ${total}`;
            document.getElementById('progress-fill').style.width = `${(current / total) * 100}%`;

            document.getElementById('hint-panel').classList.remove('visible');
            document.getElementById('feedback').classList.remove('visible');
            document.getElementById('explanation-panel').classList.remove('visible');
            document.getElementById('hint-button').disabled = false;

            // Exam mode: hide hint button and scratch-pad, show timer
            const hintButton = document.getElementById('hint-button');
            const timerContainer = document.getElementById('exam-timer-container');
            if (state.isExamMode) {
                hintButton.style.display = 'none';
                timerContainer.style.display = 'block';
                startExamTimer();
            } else {
                hintButton.style.display = 'block';
                timerContainer.style.display = 'none';
            }

            document.getElementById('question-text').innerHTML = q.text;

            const colLayout = document.getElementById('column-layout');
            if (q.columnLayout) {
                const { a, b, c, operation } = q.columnLayout;
                let layoutHTML = `<div>${a.toString().padStart(3, ' ')}</div>`;
                if (c !== undefined) {
                    layoutHTML += `<div>${b.toString().padStart(3, ' ')}</div>`;
                    layoutHTML += `<div><span class="operator">${operation}</span>${c.toString().padStart(3, ' ')}</div>`;
                } else {
                    layoutHTML += `<div><span class="operator">${operation}</span>${b.toString().padStart(3, ' ')}</div>`;
                }
                layoutHTML += `<div class="separator">&nbsp;</div>`;
                colLayout.innerHTML = layoutHTML;
                colLayout.style.display = 'block';
            } else {
                colLayout.style.display = 'none';
            }

            // Scratch pad: hide in exam mode
            const scratchPad = document.getElementById('scratch-pad');
            if (state.isExamMode) {
                scratchPad.style.display = 'none';
            } else if (q.hasScratchPad) {
                scratchPad.style.display = 'block';
                initScratchPad(q.hasHTOGrid);
            } else {
                scratchPad.style.display = 'none';
            }

            renderInput(q);
        }

        function renderInput(q) {
            const inputArea = document.getElementById('input-area');

            switch (q.type) {
                case 'numpad':
                    // Default to pen input mode
                    const defaultMode = state.inputMode || 'pen';
                    inputArea.innerHTML = `
                        <div class="answer-input-container">
                            <div class="input-mode-toggle">
                                <button class="mode-btn ${defaultMode === 'pen' ? 'active' : ''}" onclick="setInputMode('pen')">✏️ S-Pen</button>
                                <button class="mode-btn ${defaultMode === 'numpad' ? 'active' : ''}" onclick="setInputMode('numpad')">🔢 Ziffern</button>
                            </div>
                            <div id="pen-input-container" style="display: ${defaultMode === 'pen' ? 'block' : 'none'};">
                                <div class="pen-input-area">
                                    <div class="pen-input-header">
                                        <span class="pen-input-label">Antwort schreiben:</span>
                                        <div class="pen-input-buttons">
                                            <button class="pen-input-btn" onpointerdown="undoAnswerPad(event); return false;">↩ Undo</button>
                                            <button class="pen-input-btn clear" onpointerdown="clearAnswerPad(); return false;">🗑</button>
                                        </div>
                                    </div>
                                    <canvas id="answer-canvas" class="pen-input-canvas"></canvas>
                                    <div class="recognized-answer" id="recognized-answer">
                                        <span class="recognized-label">Erkannt:</span>
                                        <span class="recognized-value" id="recognized-value">-</span>
                                    </div>
                                </div>
                                <button class="pen-input-submit" onclick="submitAnswerPad()">Antwort prüfen ✓</button>
                            </div>
                            <div id="numpad-container" style="display: ${defaultMode === 'numpad' ? 'block' : 'none'};">
                                <div class="answer-display" id="answer-display"></div>
                                <div class="numpad">
                                    ${[1,2,3,4,5,6,7,8,9].map(n =>
                                        `<button class="numpad-key" onclick="pressKey('${n}')">${n}</button>`
                                    ).join('')}
                                    <button class="numpad-key backspace" onclick="pressKey('back')">⌫</button>
                                    <button class="numpad-key" onclick="pressKey('0')">0</button>
                                    <button class="numpad-key confirm" onclick="submitNumpad()">✓</button>
                                </div>
                            </div>
                        </div>
                    `;
                    // Initialize answer canvas if pen mode
                    if (defaultMode === 'pen') {
                        setTimeout(() => initAnswerPad(), 50);
                    }
                    break;

                case 'multichoice':
                    inputArea.innerHTML = `
                        <div class="choice-grid">
                            ${q.options.map((opt, i) =>
                                `<button class="choice-button" data-value="${opt}" onclick="selectChoice(this, ${opt})">${opt}</button>`
                            ).join('')}
                        </div>
                    `;
                    break;

                case 'yesno':
                    inputArea.innerHTML = `
                        <div class="yesno-container">
                            <button class="yesno-button yes" onclick="submitYesNo(true)">Ja ✓</button>
                            <button class="yesno-button no" onclick="submitYesNo(false)">Nein ✗</button>
                        </div>
                    `;
                    break;

                case 'multiselect':
                    inputArea.innerHTML = `
                        <div class="multiselect-grid">
                            ${q.options.map(opt =>
                                `<button class="multiselect-tile" data-value="${opt}" onclick="toggleMultiSelect(this)">${opt}</button>`
                            ).join('')}
                        </div>
                        <button class="confirm-button" onclick="submitMultiSelect()">Fertig ✓</button>
                    `;
                    break;
            }
        }

        // ====== EXAM TIMER ======
        function startExamTimer() {
            state.examTimeRemaining = EXAM_TIMER_SECONDS;
            updateTimerDisplay();

            state.examTimerInterval = setInterval(() => {
                state.examTimeRemaining--;
                updateTimerDisplay();

                if (state.examTimeRemaining <= 0) {
                    clearExamTimer();
                    handleTimerExpired();
                }
            }, 1000);
        }

        function clearExamTimer() {
            if (state.examTimerInterval) {
                clearInterval(state.examTimerInterval);
                state.examTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('exam-timer');
            const timerFill = document.getElementById('exam-timer-fill');

            const minutes = Math.floor(state.examTimeRemaining / 60);
            const seconds = state.examTimeRemaining % 60;
            timerEl.textContent = `⏱️ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const percentage = (state.examTimeRemaining / EXAM_TIMER_SECONDS) * 100;
            timerFill.style.width = `${percentage}%`;

            // Warning state
            if (state.examTimeRemaining <= EXAM_WARNING_SECONDS) {
                timerEl.classList.add('warning');
                timerFill.classList.add('warning');
            } else {
                timerEl.classList.remove('warning');
                timerFill.classList.remove('warning');
            }
        }

        function handleTimerExpired() {
            const q = state.questions[state.currentQuestionIndex];

            // Track as wrong for this topic
            if (q.topic) {
                trackExamTopicResult(q.topic.id, false);
            }

            // Show brief feedback
            showFeedback(false, 'Zeit abgelaufen! ⏱️');

            // Auto-advance after short delay
            setTimeout(() => {
                currentAnswer = '';
                nextQuestion();
            }, 1000);
        }

        function trackExamTopicResult(topicId, correct) {
            if (!state.examTopicResults[topicId]) {
                state.examTopicResults[topicId] = { correct: 0, total: 0 };
            }
            state.examTopicResults[topicId].total++;
            if (correct) {
                state.examTopicResults[topicId].correct++;
            }
        }

        // ====== INPUT HANDLERS ======
        let currentAnswer = '';

        function pressKey(key) {
            if (key === 'back') {
                currentAnswer = currentAnswer.slice(0, -1);
            } else {
                if (currentAnswer.length < 6) {
                    currentAnswer += key;
                }
            }
            document.getElementById('answer-display').textContent = currentAnswer;
        }
        window.pressKey = pressKey;

        function submitNumpad() {
            if (!currentAnswer) return;
            const q = state.questions[state.currentQuestionIndex];
            checkAnswer(parseInt(currentAnswer), q.answer);
        }
        window.submitNumpad = submitNumpad;

        function selectChoice(btn, value) {
            const q = state.questions[state.currentQuestionIndex];
            const isCorrect = q.correctOptions.includes(value);

            if (isCorrect) {
                btn.classList.add('correct');
                const allButtons = document.querySelectorAll('.choice-button');
                const selectedCorrect = Array.from(allButtons).filter(b =>
                    b.classList.contains('correct')
                );
                if (selectedCorrect.length === q.correctOptions.length) {
                    setTimeout(() => handleCorrect(), 300);
                }
            } else {
                btn.classList.add('incorrect');
                state.attempts++;
                if (state.attempts >= 2) {
                    setTimeout(() => handleWrong(true), 300);
                } else {
                    showFeedback(false);
                }
            }
        }
        window.selectChoice = selectChoice;

        function submitYesNo(answer) {
            const q = state.questions[state.currentQuestionIndex];
            checkAnswer(answer, q.answer);
        }
        window.submitYesNo = submitYesNo;

        function toggleMultiSelect(btn) {
            btn.classList.toggle('selected');
        }
        window.toggleMultiSelect = toggleMultiSelect;

        function submitMultiSelect() {
            const q = state.questions[state.currentQuestionIndex];
            const selected = Array.from(document.querySelectorAll('.multiselect-tile.selected'))
                .map(b => parseInt(b.dataset.value));

            const isCorrect = q.correctOptions.length === selected.length &&
                q.correctOptions.every(v => selected.includes(v));

            checkAnswer(isCorrect, true);
        }
        window.submitMultiSelect = submitMultiSelect;

        function checkAnswer(given, expected) {
            const q = state.questions[state.currentQuestionIndex];
            let isCorrect = given === expected;

            if (q.tolerance && typeof given === 'number' && typeof expected === 'number') {
                isCorrect = Math.abs(given - expected) <= q.tolerance;
            }

            // Clear timer on any answer in exam mode
            if (state.isExamMode) {
                clearExamTimer();
            }

            if (isCorrect) {
                handleCorrect();
            } else {
                state.attempts++;
                // In exam mode: always show solution after first wrong answer (no second chance)
                if (state.isExamMode || state.attempts >= 2) {
                    handleWrong(true);
                } else {
                    handleWrong(false);
                }
            }
        }

        function handleCorrect() {
            state.correctAnswers++;
            // Reset consecutive errors on correct answer
            state.sessionState.consecutiveErrors = 0;

            const q = state.questions[state.currentQuestionIndex];
            const isGerman = q.topic?.lang === 'de';

            // Track exam topic result
            if (state.isExamMode && q.topic) {
                trackExamTopicResult(q.topic.id, true);
            }

            showFeedback(true, isGerman ? 'Super! ⭐' : 'Brilliant! ⭐');
            showStarBurst();

            // Faster feedback in exam mode
            const delay = state.isExamMode ? 500 : 800;
            setTimeout(() => {
                currentAnswer = '';
                nextQuestion();
            }, delay);
        }

        function handleWrong(showSolution) {
            const display = document.getElementById('answer-display');
            if (display) {
                display.classList.add('shake');
                setTimeout(() => display.classList.remove('shake'), 500);
            }

            const q = state.questions[state.currentQuestionIndex];

            // Track exam topic result
            if (state.isExamMode && q.topic) {
                trackExamTopicResult(q.topic.id, false);
            }

            // Track consecutive errors for rage detection (not in exam mode)
            if (!state.isExamMode) {
                state.sessionState.consecutiveErrors++;

                // Check if rage stop should be triggered (3 consecutive errors, not already triggered)
                if (state.sessionState.consecutiveErrors >= 3 && !state.sessionState.rageModeTriggered) {
                    state.sessionState.rageModeTriggered = true;
                    showRageStop();
                    return;
                }
            }

            if (showSolution) {
                // In exam mode: shorter feedback, auto-advance
                if (state.isExamMode) {
                    showFeedback(false, 'Falsch! ✗');
                    setTimeout(() => {
                        currentAnswer = '';
                        nextQuestion();
                    }, 1500);
                } else {
                    showFeedback(false, 'Schau dir die Lösung an:');
                    showExplanation();
                }
            } else {
                showFeedback(false, 'Nochmal! 💪');
            }
        }

        function showFeedback(correct, message) {
            const fb = document.getElementById('feedback');
            fb.className = 'feedback visible ' + (correct ? 'correct' : 'incorrect');
            fb.textContent = message || (correct ? 'Richtig!' : 'Falsch!');
        }

        // ====== RAGE STOP ======
        function showRageStop() {
            // Select a random unlocked character (not secret)
            const unlockedChars = NORSE_UNLOCKS.filter(u =>
                u.type === 'character' &&
                state.unlockedIds.includes(u.id) &&
                !u.secret
            );

            let selectedChar;
            if (unlockedChars.length > 0) {
                selectedChar = unlockedChars[Math.floor(Math.random() * unlockedChars.length)];
            } else {
                // Fallback to default
                selectedChar = { id: 'default', emoji: '✨', name: 'Die Götter' };
            }

            // Get random message for character
            const messages = RAGE_MESSAGES[selectedChar.id] || RAGE_MESSAGES['default'];
            const message = messages[Math.floor(Math.random() * messages.length)];

            // Create overlay
            const overlay = document.createElement('div');
            overlay.className = 'rage-overlay';
            overlay.id = 'rage-overlay';
            overlay.innerHTML = `
                <div class="rage-character">${selectedChar.emoji}</div>
                <div class="rage-name">${selectedChar.name}</div>
                <div class="rage-message">${message}</div>
                <div class="rage-timer-container">
                    <div class="rage-timer-text">Die Götter geben dir 30 Sekunden Auszeit...</div>
                    <div class="rage-timer-bar">
                        <div class="rage-timer-fill" id="rage-timer-fill" style="width: 0%"></div>
                    </div>
                </div>
                <button class="rage-button" id="rage-button" onclick="closeRageStop()">Ich bin bereit! ⚡</button>
            `;
            document.body.appendChild(overlay);

            // Animate timer
            let elapsed = 0;
            const duration = 30000; // 30 seconds
            const enableAt = 15000; // Enable button after 15 seconds
            const timerFill = document.getElementById('rage-timer-fill');
            const rageButton = document.getElementById('rage-button');

            const timerInterval = setInterval(() => {
                elapsed += 100;
                const progress = (elapsed / duration) * 100;
                timerFill.style.width = `${Math.min(progress, 100)}%`;

                if (elapsed >= enableAt && !rageButton.classList.contains('active')) {
                    rageButton.classList.add('active');
                }

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                    rageButton.classList.add('active');
                }
            }, 100);

            overlay.dataset.timerInterval = timerInterval;
        }
        window.showRageStop = showRageStop;

        function closeRageStop() {
            const overlay = document.getElementById('rage-overlay');
            if (overlay) {
                if (overlay.dataset.timerInterval) {
                    clearInterval(parseInt(overlay.dataset.timerInterval));
                }
                overlay.remove();
            }
            // Reset consecutive errors after rage stop
            state.sessionState.consecutiveErrors = 0;
        }
        window.closeRageStop = closeRageStop;

        function showExplanation() {
            const q = state.questions[state.currentQuestionIndex];
            document.getElementById('explanation-content').textContent = q.explanation;
            document.getElementById('explanation-panel').classList.add('visible');

            document.querySelectorAll('.numpad-key, .choice-button, .yesno-button, .multiselect-tile, .confirm-button')
                .forEach(b => b.disabled = true);
        }

        function nextQuestion() {
            currentAnswer = '';
            state.currentQuestionIndex++;

            if (state.currentQuestionIndex >= state.questions.length) {
                endSession();
            } else {
                renderQuestion();
            }
        }
        window.nextQuestion = nextQuestion;

        // ====== HINTS ======
        function showHint() {
            const q = state.questions[state.currentQuestionIndex];
            state.hintLevel++;
            state.usedHints++;

            const panel = document.getElementById('hint-panel');
            const title = document.getElementById('hint-title');
            const content = document.getElementById('hint-content');

            if (state.hintLevel === 1) {
                title.textContent = 'Tipp:';
                content.textContent = q.hint1;
            } else {
                title.textContent = 'Beispiel:';
                content.innerHTML = q.hint2.replace(/\n/g, '<br>');
            }

            panel.classList.add('visible');

            if (state.hintLevel >= 2) {
                document.getElementById('hint-button').disabled = true;
            }
        }
        window.showHint = showHint;

        // ====== SCRATCH PAD ======
        let scratchCanvas, scratchCtx;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let scratchHistory = []; // Undo history for scratch pad
        let currentScratchHTOGrid = false;

        function initScratchPad(showHTOGrid = false) {
            scratchCanvas = document.getElementById('scratch-canvas');
            scratchCtx = scratchCanvas.getContext('2d');
            scratchHistory = []; // Clear history
            currentScratchHTOGrid = showHTOGrid;

            const rect = scratchCanvas.getBoundingClientRect();
            scratchCanvas.width = rect.width * 2;
            scratchCanvas.height = rect.height * 2;
            scratchCtx.scale(2, 2);

            drawScratchBackground(rect, showHTOGrid);

            scratchCtx.strokeStyle = '#B8860B';
            scratchCtx.lineWidth = 2.5;
            scratchCtx.lineCap = 'round';
            scratchCtx.lineJoin = 'round';

            // Save initial state
            saveToHistory(scratchCanvas, scratchHistory);

            scratchCanvas.onpointerdown = (e) => startScratchDraw(e);
            scratchCanvas.onpointermove = (e) => drawOnScratch(e);
            scratchCanvas.onpointerup = () => stopScratchDraw();
            scratchCanvas.onpointerleave = () => stopScratchDraw();
        }

        function drawScratchBackground(rect, showHTOGrid) {
            scratchCtx.fillStyle = '#152238';
            scratchCtx.fillRect(0, 0, rect.width, rect.height);

            scratchCtx.strokeStyle = '#2E4A6B';
            scratchCtx.lineWidth = 1;

            if (showHTOGrid) {
                const colWidth = rect.width / 3;

                scratchCtx.beginPath();
                scratchCtx.moveTo(colWidth, 0);
                scratchCtx.lineTo(colWidth, rect.height);
                scratchCtx.moveTo(colWidth * 2, 0);
                scratchCtx.lineTo(colWidth * 2, rect.height);
                scratchCtx.stroke();

                scratchCtx.fillStyle = '#A89F8C';
                scratchCtx.font = '14px Nunito';
                scratchCtx.textAlign = 'center';
                scratchCtx.fillText('H', colWidth / 2, 20);
                scratchCtx.fillText('T', colWidth * 1.5, 20);
                scratchCtx.fillText('O', colWidth * 2.5, 20);

                scratchCtx.strokeStyle = '#A89F8C';
                scratchCtx.lineWidth = 2;
                scratchCtx.beginPath();
                scratchCtx.moveTo(10, rect.height - 40);
                scratchCtx.lineTo(rect.width - 10, rect.height - 40);
                scratchCtx.stroke();
            } else {
                for (let y = 30; y < rect.height; y += 30) {
                    scratchCtx.beginPath();
                    scratchCtx.moveTo(0, y);
                    scratchCtx.lineTo(rect.width, y);
                    scratchCtx.stroke();
                }
            }
        }

        function startScratchDraw(e) {
            isDrawing = true;
            const rect = scratchCanvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
            scratchCtx.strokeStyle = '#B8860B';
            scratchCtx.lineWidth = 2.5;
            scratchCtx.lineCap = 'round';
            scratchCtx.lineJoin = 'round';
        }

        function drawOnScratch(e) {
            if (!isDrawing) return;

            const rect = scratchCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            scratchCtx.beginPath();
            scratchCtx.moveTo(lastX, lastY);
            scratchCtx.lineTo(x, y);
            scratchCtx.stroke();

            lastX = x;
            lastY = y;
        }

        function stopScratchDraw() {
            if (isDrawing) {
                isDrawing = false;
                // Save state after stroke ends
                saveToHistory(scratchCanvas, scratchHistory);
            }
        }

        function saveToHistory(canvas, history) {
            // Limit history size
            if (history.length > 50) {
                history.shift();
            }
            history.push(canvas.toDataURL());
        }

        function undoScratchPad(e) {
            if (e) e.preventDefault();

            if (scratchHistory.length > 1) {
                scratchHistory.pop(); // Remove current state
                const prevState = scratchHistory[scratchHistory.length - 1];

                // Restore with correct transform handling
                const img = new Image();
                img.onload = () => {
                    scratchCtx.setTransform(1, 0, 0, 1, 0, 0);
                    scratchCtx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);
                    scratchCtx.drawImage(img, 0, 0);
                    // Restore 2x scale
                    scratchCtx.setTransform(2, 0, 0, 2, 0, 0);
                    scratchCtx.strokeStyle = '#B8860B';
                    scratchCtx.lineWidth = 2.5;
                    scratchCtx.lineCap = 'round';
                    scratchCtx.lineJoin = 'round';
                };
                img.src = prevState;
            }
        }
        window.undoScratchPad = undoScratchPad;

        function clearScratchPad() {
            const q = state.questions[state.currentQuestionIndex];
            initScratchPad(q.hasHTOGrid);
        }
        window.clearScratchPad = clearScratchPad;

        // ====== ANSWER PAD (S-Pen Input for Numbers) ======
        let answerCanvas, answerCtx;
        let answerHistory = []; // Canvas states for undo
        let answerStrokes = []; // Array of stroke objects {x: [], y: []}
        let currentStroke = null;
        let isAnswerDrawing = false;
        let answerLastX = 0, answerLastY = 0;
        let recognizedAnswer = '';
        let recognitionTimeout = null;

        function initAnswerPad() {
            answerCanvas = document.getElementById('answer-canvas');
            if (!answerCanvas) return;

            answerCtx = answerCanvas.getContext('2d');
            answerHistory = [];
            answerStrokes = [];
            currentStroke = null;
            recognizedAnswer = '';

            const rect = answerCanvas.getBoundingClientRect();
            answerCanvas.width = rect.width * 2;
            answerCanvas.height = rect.height * 2;
            answerCtx.scale(2, 2);

            // Clear with background
            answerCtx.fillStyle = '#0D1B2A';
            answerCtx.fillRect(0, 0, rect.width, rect.height);

            // Set drawing style
            answerCtx.strokeStyle = '#B8860B';
            answerCtx.lineWidth = 3;
            answerCtx.lineCap = 'round';
            answerCtx.lineJoin = 'round';

            // Save initial state
            answerHistory.push(answerCanvas.toDataURL());

            // Update display
            updateRecognizedDisplay('-');

            answerCanvas.onpointerdown = startAnswerDraw;
            answerCanvas.onpointermove = drawOnAnswer;
            answerCanvas.onpointerup = stopAnswerDraw;
            answerCanvas.onpointerleave = stopAnswerDraw;
        }

        function startAnswerDraw(e) {
            e.preventDefault();
            isAnswerDrawing = true;
            const rect = answerCanvas.getBoundingClientRect();
            answerLastX = e.clientX - rect.left;
            answerLastY = e.clientY - rect.top;

            // Start new stroke
            currentStroke = { x: [answerLastX], y: [answerLastY] };

            answerCtx.strokeStyle = '#B8860B';
            answerCtx.lineWidth = 3;
            answerCtx.lineCap = 'round';
            answerCtx.lineJoin = 'round';
        }

        function drawOnAnswer(e) {
            if (!isAnswerDrawing || !currentStroke) return;
            e.preventDefault();

            const rect = answerCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            answerCtx.beginPath();
            answerCtx.moveTo(answerLastX, answerLastY);
            answerCtx.lineTo(x, y);
            answerCtx.stroke();

            // Add point to current stroke
            currentStroke.x.push(x);
            currentStroke.y.push(y);

            answerLastX = x;
            answerLastY = y;
        }

        function stopAnswerDraw() {
            if (isAnswerDrawing && currentStroke && currentStroke.x.length > 1) {
                isAnswerDrawing = false;

                // Save stroke as object
                answerStrokes.push({ x: [...currentStroke.x], y: [...currentStroke.y] });

                // Save canvas state
                answerHistory.push(answerCanvas.toDataURL());

                // Trigger recognition after a short delay
                if (recognitionTimeout) clearTimeout(recognitionTimeout);
                recognitionTimeout = setTimeout(() => recognizeHandwriting(), 400);
            }
            isAnswerDrawing = false;
            currentStroke = null;
        }

        function updateRecognizedDisplay(value, isError = false) {
            const el = document.getElementById('recognized-value');
            if (el) {
                el.textContent = value;
                el.className = 'recognized-value' + (isError ? ' error' : '');
            }
        }

        async function recognizeHandwriting() {
            if (answerStrokes.length === 0) {
                updateRecognizedDisplay('-');
                recognizedAnswer = '';
                return;
            }

            // Build ink data for Google Handwriting API
            // Format: [[x1, x2, x3...], [y1, y2, y3...]] for each stroke
            const ink = answerStrokes.map(stroke => [stroke.x, stroke.y]);

            if (ink.length === 0) {
                updateRecognizedDisplay('-');
                return;
            }

            const rect = answerCanvas.getBoundingClientRect();
            const requestData = {
                options: "enable_pre_space",
                requests: [{
                    writing_guide: {
                        writing_area_width: rect.width,
                        writing_area_height: rect.height
                    },
                    ink: ink,
                    language: "de"
                }]
            };

            try {
                const response = await fetch('https://inputtools.google.com/request?itc=de-t-i0-handwrit&app=translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1]) {
                    const candidates = data[1][0][1];
                    // Find first numeric candidate
                    for (const candidate of candidates) {
                        const cleaned = candidate.replace(/[^0-9]/g, '');
                        if (cleaned.length > 0) {
                            recognizedAnswer = cleaned;
                            updateRecognizedDisplay(cleaned);
                            return;
                        }
                    }
                    // If no numeric, show first candidate
                    recognizedAnswer = candidates[0];
                    updateRecognizedDisplay(candidates[0]);
                } else {
                    updateRecognizedDisplay('?', true);
                    recognizedAnswer = '';
                }
            } catch (error) {
                console.log('Handwriting recognition error:', error);
                updateRecognizedDisplay('Offline', true);
                recognizedAnswer = '';
            }
        }

        function undoAnswerPad(e) {
            if (e) e.preventDefault();

            if (answerHistory.length > 1 && answerStrokes.length > 0) {
                // Remove last stroke
                answerStrokes.pop();
                // Remove last canvas state
                answerHistory.pop();

                // Restore previous state - reset transform first
                const prevState = answerHistory[answerHistory.length - 1];
                const img = new Image();
                img.onload = () => {
                    // Reset transform, draw, then restore scale
                    answerCtx.setTransform(1, 0, 0, 1, 0, 0);
                    answerCtx.clearRect(0, 0, answerCanvas.width, answerCanvas.height);
                    answerCtx.drawImage(img, 0, 0);
                    // Restore 2x scale for future drawing
                    answerCtx.setTransform(2, 0, 0, 2, 0, 0);
                    answerCtx.strokeStyle = '#B8860B';
                    answerCtx.lineWidth = 3;
                    answerCtx.lineCap = 'round';
                    answerCtx.lineJoin = 'round';
                };
                img.src = prevState;

                // Re-recognize
                if (recognitionTimeout) clearTimeout(recognitionTimeout);
                if (answerStrokes.length > 0) {
                    recognitionTimeout = setTimeout(() => recognizeHandwriting(), 400);
                } else {
                    updateRecognizedDisplay('-');
                    recognizedAnswer = '';
                }
            }
        }
        window.undoAnswerPad = undoAnswerPad;

            if (answer !== null && answer.trim() !== '') {
                const num = parseInt(answer.trim());
                if (!isNaN(num)) {

        // ====== END SESSION ======
        async function endSession() {
            showConfetti();

            const score = state.correctAnswers;
            const total = state.questions.length;
            const percentage = Math.round((score / total) * 100);
            const isExam = state.isExamMode;

            // Update topic performance
            if (!isExam && state.currentTopic) {
                const topicId = state.currentTopic.id;
                if (!state.topicPerformance[topicId]) {
                    state.topicPerformance[topicId] = {
                        sessions: 0,
                        totalCorrect: 0,
                        totalQuestions: 0,
                        lastScore: 0,
                        highScore: 0,
                        played: false,
                        recentScores: [],
                        lastPlayedDate: null
                    };
                }
                const perf = state.topicPerformance[topicId];
                perf.sessions++;
                perf.totalCorrect += score;
                perf.totalQuestions += total;
                perf.lastScore = percentage;
                perf.highScore = Math.max(perf.highScore, percentage);
                perf.played = true;
                perf.lastPlayedDate = new Date().toISOString().split('T')[0]; // YYYY-MM-DD

                // Clear highlight after practicing this topic
                state.highlightWeakTopics = state.highlightWeakTopics.filter(id => id !== topicId);

                // Track recent scores for difficulty adjustment (newest first, max 3)
                if (!perf.recentScores) perf.recentScores = [];
                perf.recentScores.unshift(percentage);
                if (perf.recentScores.length > 3) {
                    perf.recentScores = perf.recentScores.slice(0, 3);
                }

                // Check if all topics have been played
                if (!state.allTopicsPlayedOnce && checkAllTopicsPlayed()) {
                    state.allTopicsPlayedOnce = true;
                }

                // Adjust difficulty based on performance (after save)
                setTimeout(() => adjustDifficulty(topicId, percentage), 500);
            }

            // Update streak
            if (percentage === 100) {
                state.streakCount++;
            } else {
                state.streakCount = 0;
            }

            // Update exam high scores
            if (isExam) {
                const examId = 'exam_' + Date.now();
                state.examHighScores[examId] = percentage;
            }

            await saveProgress();

            // Update UI
            document.getElementById('end-title').textContent = isExam ? 'Prüfung abgeschlossen!' : 'Thema abgeschlossen!';
            document.getElementById('end-score').textContent = `${score} von ${total} richtig (${percentage}%)`;

            // Topic breakdown for exam mode
            const breakdownEl = document.getElementById('topic-breakdown');
            const endButtonsEl = document.getElementById('end-buttons');
            if (isExam && Object.keys(state.examTopicResults).length > 0) {
                const strengths = [];
                const weaknesses = [];

                for (const [topicId, result] of Object.entries(state.examTopicResults)) {
                    const topic = topics.find(t => t.id === topicId);
                    const pct = Math.round((result.correct / result.total) * 100);
                    const item = {
                        topicId,
                        name: topic ? topic.name : topicId,
                        correct: result.correct,
                        total: result.total,
                        pct
                    };
                    if (pct === 100) {
                        strengths.push(item);
                    } else {
                        weaknesses.push(item);
                    }
                }

                // Save weak topics for spaced repetition
                state.lastExamWeakTopics = weaknesses.map(w => w.topicId);

                let breakdownHTML = '';
                if (strengths.length > 0) {
                    breakdownHTML += `<div class="breakdown-section">
                        <div class="breakdown-header strengths">── Stärken ──</div>
                        ${strengths.map(s => `<div class="breakdown-item strength">✓ ${s.name}: ${s.correct}/${s.total} perfekt!</div>`).join('')}
                    </div>`;
                }
                if (weaknesses.length > 0) {
                    breakdownHTML += `<div class="breakdown-section">
                        <div class="breakdown-header weaknesses">── Schwächen ──</div>
                        ${weaknesses.map(w => `<div class="breakdown-item weakness">✗ ${w.name}: ${w.correct}/${w.total}</div>`).join('')}
                    </div>`;
                }

                breakdownEl.innerHTML = breakdownHTML;
                breakdownEl.style.display = 'block';

                // Add "Practice weaknesses" button if there are weaknesses
                if (weaknesses.length > 0) {
                    endButtonsEl.innerHTML = `
                        <button class="weakness-button" onclick="practiceExamWeaknesses()">Schwächen üben 🎯</button>
                        <button class="home-button" onclick="goHome()">Weiter üben</button>
                        <button class="hall-button-end" onclick="showHallScreen()">ᚼ Halle der Götter</button>
                    `;
                } else {
                    endButtonsEl.innerHTML = `
                        <button class="home-button" onclick="goHome()">Weiter üben</button>
                        <button class="hall-button-end" onclick="showHallScreen()">ᚼ Halle der Götter</button>
                    `;
                }
            } else {
                breakdownEl.style.display = 'none';
                endButtonsEl.innerHTML = `
                    <button class="home-button" onclick="goHome()">Weiter üben</button>
                    <button class="hall-button-end" onclick="showHallScreen()">ᚼ Halle der Götter</button>
                `;
            }

            // Show streak if > 0
            const streakHTML = state.streakCount > 0 ?
                `<div class="streak-display"><span class="streak-fire">🔥</span><span class="streak-text">${state.streakCount} Session${state.streakCount !== 1 ? 's' : ''} in Folge perfekt!</span></div>` : '';

            // Calculate overall progress
            const overallAvg = getOverallAverage();
            document.getElementById('end-total-stars').innerHTML = `Gesamtdurchschnitt: ${overallAvg}%${streakHTML}`;

            // Star display based on percentage
            let stars = 0;
            if (percentage >= 90) stars = 3;
            else if (percentage >= 80) stars = 2;
            else if (percentage >= 60) stars = 1;
            document.getElementById('end-stars').innerHTML = '⭐'.repeat(stars) + '<span class="star-empty">' + '☆'.repeat(3 - stars) + '</span>';

            // Next unlock info
            const nextUnlock = getNextUnlock();
            const nextUnlockEl = document.getElementById('end-next-unlock');
            if (nextUnlock) {
                const conditionText = getConditionText(nextUnlock);
                nextUnlockEl.innerHTML = `${nextUnlock.emoji} <strong>${nextUnlock.name}</strong>: ${conditionText}`;
            } else {
                nextUnlockEl.innerHTML = 'Alle Götter freigeschaltet! ✨';

            const messageEl = document.getElementById('end-message');
            if (isExam && percentage >= 80) {
                messageEl.className = 'end-message special';
                messageEl.textContent = 'Du bist BEREIT für die Prüfung! Die Götter sind mit dir! ⚡';
            } else if (percentage >= 90) {
                messageEl.className = 'end-message';
                messageEl.textContent = 'Perfekt! Die Götter sind beeindruckt! 🌟';
            } else if (percentage >= 80) {
                messageEl.className = 'end-message';
                messageEl.textContent = 'Sehr gut! Fast perfekt! 💪';
            } else if (percentage >= 60) {
                messageEl.className = 'end-message';
                messageEl.textContent = 'Gut gemacht! Noch ein bisschen üben! 📚';
            } else {
                messageEl.className = 'end-message';
                messageEl.textContent = 'Weiter üben! Du schaffst das! 💪';
            }

            showScreen('end-screen');

            // Check for new unlocks
            await checkAndUnlock();
        }

        function getNextUnlock() {
            // Find first unlock that is not yet unlocked and not secret
            const notUnlocked = NORSE_UNLOCKS
                .filter(u => !state.unlockedIds.includes(u.id) && !u.secret && !u.fullyHidden);
            return notUnlocked[0] || null;
        }

        // ====== UNLOCK SYSTEM ======
        async function checkAndUnlock() {
            const newUnlocks = [];

            for (const unlock of NORSE_UNLOCKS) {
                // Skip if already unlocked
                if (state.unlockedIds.includes(unlock.id)) continue;

                // Check condition
                if (checkCondition(unlock)) {
                    state.unlockedIds.push(unlock.id);
                    newUnlocks.push(unlock);

                    // Trophäenraum-Export (fire and forget)
                    const unlockedItem = NORSE_UNLOCKS.find(u => u.id === unlock.id);
                    if (unlockedItem) {
                        exportTrophyToSharedStorage(unlockedItem);
                    }
                }
            }

            if (newUnlocks.length > 0) {
                await saveProgress();
                updateHallBadge();
                // Show animation for first new unlock
                showUnlockAnimation(newUnlocks[0]);
            }
        }

        function loadThreeJS(item) {
            if (threeLoaded) {

            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            script.onload = () => {
                const gltfScript = document.createElement('script');
                gltfScript.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
                gltfScript.onload = () => {
                    threeLoaded = true;
                    init3DScene(item);
                };
                gltfScript.onerror = () => showViewerFallback();
                document.head.appendChild(gltfScript);

            script.onerror = () => showViewerFallback();
            document.head.appendChild(script);
