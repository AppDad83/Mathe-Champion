<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mathe-Champion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Nunito:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1B3A6B;
            --primary-light: #2E5FA3;
            --primary-dark: #122649;
            --accent: #B8860B;
            --accent-light: #D4A017;
            --background: #0D1B2A;
            --surface: #152238;
            --success: #2D6A4F;
            --success-light: #40916C;
            --error: #9B2335;
            --error-light: #C1394B;
            --card-bg: #1A2F4A;
            --scratch-bg: #152238;
            --scratch-line: #2E4A6B;
            --text: #F0E6D3;
            --text-light: #A89F8C;
            --stroke-color: #B8860B;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--background);
            background-image: radial-gradient(circle at 20% 50%, #1B3A6B22 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, #B8860B11 0%, transparent 40%);
            color: var(--text);
            font-size: 18px;
            line-height: 1.5;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Medieval Font for Headings */
        h1, h2, .screen-title, .topic-name, .hall-title {
            font-family: 'MedievalSharp', cursive;
        }

        /* Rune Divider */
        .rune-divider {
            text-align: center;
            color: var(--accent);
            font-size: 14px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .rune-divider::before,
        .rune-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .rune-divider .runes {
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 4px;
        }

        /* Norse Card */
        .norse-card {
            background: var(--card-bg);
            border: 1px solid #B8860B33;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .norse-card::before {
            content: 'ᚠ';
            position: absolute;
            font-size: 120px;
            color: var(--accent);
            opacity: 0.04;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(184, 134, 11, 0.3);
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .header .rune-subtitle {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .yggdrasil-banner {
            width: 80px;
            height: 60px;
            margin: 16px auto;
            opacity: 0.7;
        }

        .prophecy-box {
            margin-top: 16px;
            padding: 12px 20px;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 12px;
            display: inline-block;
        }

        .prophecy-box .prophecy-title {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .prophecy-box .countdown {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        /* Topic Grid */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
            flex: 1;
        }

        .topic-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .topic-card::before {
            content: 'ᚱ';
            position: absolute;
            font-size: 80px;
            color: var(--accent);
            opacity: 0.03;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .topic-card:hover, .topic-card:active {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(184, 134, 11, 0.25);
            border-color: var(--accent);
        }

        .topic-card .topic-rune {
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .topic-card .topic-name {
            font-size: 15px;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 8px;
        }

        .topic-card .topic-lang {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .topic-card .stars {
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .star-empty {
            opacity: 0.3;
        }

        /* Primary Buttons (Gold) */
        .btn-primary {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
        }

        .btn-primary:hover, .btn-primary:active {
            background: var(--accent-light);
            box-shadow: 0 6px 16px rgba(212, 160, 23, 0.4);
            transform: translateY(-1px);
        }

        /* Exam Button */
        .exam-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(184, 134, 11, 0.3);
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-top: 12px;
        }

        .exam-button:hover, .exam-button:active {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 160, 23, 0.4);
        }

        /* Hall Button */
        .hall-button {
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-top: auto;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hall-button:hover {
            background: var(--accent);
            color: var(--background);
        }

        .hall-button .badge {
            background: var(--accent);
            color: var(--background);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 8px;
        }

        .hall-button:hover .badge {
            background: var(--background);
            color: var(--accent);
        }

        /* Progress Bar */
        .progress-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: var(--scratch-line);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Question Area */
        .question-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            position: relative;
        }

        .hint-button {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--primary);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .hint-button:hover {
            background: var(--accent);
            color: var(--background);
        }

        .question-text {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
            padding-right: 60px;
        }

        .question-text .keyword {
            color: var(--accent);
            font-weight: 800;
        }

        /* Column Layout for Addition/Subtraction */
        .column-layout {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            text-align: right;
            background: var(--scratch-bg);
            padding: 20px 30px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 200px;
            line-height: 1.6;
            border: 1px solid var(--scratch-line);
        }

        .column-layout .operator {
            float: left;
        }

        .column-layout .separator {
            border-top: 3px solid var(--text);
            margin-top: 8px;
            padding-top: 8px;
        }

        /* Hint Panel */
        .hint-panel {
            background: linear-gradient(135deg, #2D3A1F, #3D4A2F);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .hint-panel.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .hint-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .hint-content {
            color: var(--text);
            font-size: 16px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scratch Pad */
        .scratch-pad {
            margin: 20px 0;
        }

        .scratch-pad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .scratch-pad-title {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .scratch-clear {
            background: var(--error);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .scratch-canvas {
            width: 100%;
            height: 180px;
            background: var(--scratch-bg);
            border-radius: 12px;
            border: 2px solid var(--scratch-line);
            touch-action: none;
            cursor: crosshair;
        }

        /* Numpad */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }

        .numpad-key {
            background: var(--card-bg);
            border: 2px solid var(--scratch-line);
            border-radius: 12px;
            padding: 16px;
            min-height: 64px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .numpad-key:hover, .numpad-key:active {
            background: var(--primary-light);
            border-color: var(--accent);
        }

        .numpad-key.backspace {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }

        .numpad-key.confirm {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .numpad-key.confirm:hover {
            background: var(--success-light);
        }

        .answer-display {
            background: var(--card-bg);
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-display.shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Multiple Choice */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .choice-button {
            background: var(--card-bg);
            border: 3px solid var(--scratch-line);
            border-radius: 12px;
            padding: 20px;
            min-height: 80px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .choice-button:hover {
            border-color: var(--accent);
            background: var(--primary-light);
        }

        .choice-button.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--background);
        }

        .choice-button.correct {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .choice-button.incorrect {
            border-color: var(--error);
            background: var(--error);
            color: white;
        }

        /* Yes/No Buttons */
        .yesno-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .yesno-button {
            padding: 24px;
            min-height: 100px;
            font-size: 28px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .yesno-button.yes {
            background: var(--success);
            color: white;
        }

        .yesno-button.no {
            background: var(--error);
            color: white;
        }

        .yesno-button:hover {
            transform: scale(1.02);
        }

        /* Multi-select */
        .multiselect-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .multiselect-tile {
            background: var(--card-bg);
            border: 3px solid var(--scratch-line);
            border-radius: 12px;
            padding: 16px;
            min-height: 64px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .multiselect-tile.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--background);
        }

        .confirm-button {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            transition: all 0.2s ease;
        }

        .confirm-button:hover {
            background: var(--success-light);
        }

        /* Feedback */
        .feedback {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 700;
            font-size: 20px;
            display: none;
        }

        .feedback.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #1D4A3A, #2D6A4F);
            color: #A7F3D0;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #4A1D2A, #6A2D3F);
            color: #FECACA;
        }

        /* Explanation Panel */
        .explanation-panel {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }

        .explanation-panel.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 18px;
        }

        .explanation-content {
            font-size: 16px;
            line-height: 1.6;
        }

        .next-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .next-button:hover {
            background: var(--accent-light);
        }

        /* Star Burst Animation */
        .star-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }

        .burst-star {
            position: absolute;
            font-size: 32px;
            animation: burstOut 0.8s ease-out forwards;
        }

        @keyframes burstOut {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confettiFall 2s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .end-screen h2 {
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .end-stars {
            font-size: 48px;
            margin: 20px 0;
            letter-spacing: 8px;
        }

        .end-score {
            font-size: 24px;
            margin: 20px 0;
            color: var(--text);
        }

        .end-total-stars {
            font-size: 16px;
            color: var(--accent);
            margin: 10px 0;
        }

        .end-next-unlock {
            font-size: 14px;
            color: var(--text-light);
            margin: 10px 0;
            padding: 10px;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--accent);
        }

        .end-message {
            font-size: 20px;
            color: var(--text-light);
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #2D3A1F, #3D4A2F);
            border-radius: 12px;
        }

        .end-message.special {
            background: linear-gradient(135deg, #1D4A3A, #2D6A4F);
            color: #A7F3D0;
            font-weight: 700;
        }

        .end-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .home-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .home-button:hover {
            background: var(--accent-light);
        }

        .hall-button-end {
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .hall-button-end:hover {
            background: var(--accent);
            color: var(--background);
        }

        /* Back Button */
        .back-button {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            padding: 8px 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            color: var(--accent-light);
        }

        /* Hide screens */
        .screen {
            display: none;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--scratch-line);

        // Capacitor Preferences wrapper with localStorage fallback
        const Storage = {
            async get(key) {
                try {
                    // Check if Capacitor Preferences plugin is available
                    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
                        const result = await window.Capacitor.Plugins.Preferences.get({ key });
                        return result.value;
                    }
                } catch (e) {
                    console.log('Capacitor Preferences not available, using localStorage');
                }
                return localStorage.getItem(key);
            },
            async set(key, value) {
                try {
                    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
                        await window.Capacitor.Plugins.Preferences.set({ key, value });
                        return;
                    }
                } catch (e) {
                    console.log('Capacitor Preferences not available, using localStorage');
                }
                localStorage.setItem(key, value);
            }
        };

        // Make Storage globally available
        window.Storage = Storage;

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>

                const savedUnlocks = await window.Storage.get('norseUnlocks');
