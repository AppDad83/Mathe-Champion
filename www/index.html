<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mathe-Champion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Nunito:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent zoom on button tap */
        button, input, select, textarea {
            font-size: 16px;
            touch-action: manipulation;
        }

        :root {
            --primary: #1B3A6B;
            --primary-light: #2E5FA3;
            --primary-dark: #122649;
            --accent: #B8860B;
            --accent-light: #D4A017;
            --background: #0D1B2A;
            --surface: #152238;
            --success: #2D6A4F;
            --success-light: #40916C;
            --error: #9B2335;
            --error-light: #C1394B;
            --card-bg: #1A2F4A;
            --scratch-bg: #152238;
            --scratch-line: #2E4A6B;
            --text: #F0E6D3;
            --text-light: #A89F8C;
            --stroke-color: #B8860B;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--background);
            background-image: radial-gradient(circle at 20% 50%, #1B3A6B22 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, #B8860B11 0%, transparent 40%);
            color: var(--text);
            font-size: 18px;
            line-height: 1.5;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Medieval Font for Headings */
        h1, h2, .screen-title, .topic-name, .hall-title {
            font-family: 'MedievalSharp', cursive;
        }

        /* Rune Divider */
        .rune-divider {
            text-align: center;
            color: var(--accent);
            font-size: 14px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .rune-divider::before,
        .rune-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .rune-divider .runes {
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 4px;
        }

        /* Norse Card */
        .norse-card {
            background: var(--card-bg);
            border: 1px solid #B8860B33;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .norse-card::before {
            content: 'ᚠ';
            position: absolute;
            font-size: 120px;
            color: var(--accent);
            opacity: 0.04;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(184, 134, 11, 0.3);
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .header .rune-subtitle {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .yggdrasil-banner {
            width: 80px;
            height: 60px;
            margin: 16px auto;
            opacity: 0.7;
        }

        .prophecy-box {
            margin-top: 16px;
            padding: 12px 20px;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 12px;
            display: inline-block;
        }

        .prophecy-box .prophecy-title {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .prophecy-box .countdown {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        /* Topic Grid */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
            flex: 1;
        }

        .topic-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .topic-card::before {
            content: 'ᚱ';
            position: absolute;
            font-size: 80px;
            color: var(--accent);
            opacity: 0.03;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .topic-card:hover, .topic-card:active {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(184, 134, 11, 0.25);
            border-color: var(--accent);
        }

        .topic-card .topic-rune {
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .topic-card .topic-name {
            font-size: 15px;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 8px;
        }

        .topic-card .topic-lang {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .topic-card .stars {
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .star-empty {
            opacity: 0.3;
        }

        /* Primary Buttons (Gold) */
        .btn-primary {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
        }

        .btn-primary:hover, .btn-primary:active {
            background: var(--accent-light);
            box-shadow: 0 6px 16px rgba(212, 160, 23, 0.4);
            transform: translateY(-1px);
        }

        /* Exam Button */
        .exam-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(184, 134, 11, 0.3);
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-top: 12px;
        }

        .exam-button:hover, .exam-button:active {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 160, 23, 0.4);
        }

        /* Hall Button */
        .hall-button {
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-top: auto;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hall-button:hover {
            background: var(--accent);
            color: var(--background);
        }

        .hall-button .badge {
            background: var(--accent);
            color: var(--background);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 8px;
        }

        .hall-button:hover .badge {
            background: var(--background);
            color: var(--accent);
        }

        /* Progress Bar */
        .progress-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: var(--scratch-line);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Exam Timer */
        .exam-timer-container {
            position: absolute;
            top: 16px;
            right: 16px;
            text-align: right;
        }

        .exam-timer {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }

        .exam-timer.warning {
            color: var(--error-light);
            animation: timerPulse 0.5s ease-in-out infinite;
        }

        @keyframes timerPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .exam-timer-bar {
            width: 80px;
            height: 6px;
            background: var(--scratch-line);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .exam-timer-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .exam-timer-fill.warning {
            background: var(--error-light);
        }

        /* Topic Breakdown in End Screen */
        .topic-breakdown {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            text-align: left;
        }

        .breakdown-section {
            margin-bottom: 12px;
        }

        .breakdown-section:last-child {
            margin-bottom: 0;
        }

        .breakdown-header {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--scratch-line);
        }

        .breakdown-header.strengths {
            color: var(--accent);
        }

        .breakdown-header.weaknesses {
            color: var(--error-light);
        }

        .breakdown-item {
            font-size: 14px;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breakdown-item.strength {
            color: var(--accent);
        }

        .breakdown-item.weakness {
            color: var(--error-light);
        }

        .weakness-button {
            background: var(--error);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .weakness-button:hover {
            background: var(--error-light);
        }

        /* Highlighted Topic Cards */
        .topic-card.highlight-weak {
            border: 2px solid var(--accent);
            animation: highlightPulse 2s ease-in-out infinite;
        }

        @keyframes highlightPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(184, 134, 11, 0.4); }
            50% { box-shadow: 0 0 15px 3px rgba(184, 134, 11, 0.6); }
        }

        .topic-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: var(--background);
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .topic-badge.recommended {
            background: var(--primary-light);
            color: var(--text);
        }

        /* Question Area */
        .question-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            position: relative;
        }

        .hint-button {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--primary);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .hint-button:hover {
            background: var(--accent);
            color: var(--background);
        }

        .question-text {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
            padding-right: 60px;
        }

        .question-text .keyword {
            color: var(--accent);
            font-weight: 800;
        }

        /* Column Layout for Addition/Subtraction */
        .column-layout {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            text-align: right;
            background: var(--scratch-bg);
            padding: 20px 30px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 200px;
            line-height: 1.6;
            border: 1px solid var(--scratch-line);
        }

        .column-layout .operator {
            float: left;
        }

        .column-layout .separator {
            border-top: 3px solid var(--text);
            margin-top: 8px;
            padding-top: 8px;
        }

        /* Hint Panel */
        .hint-panel {
            background: linear-gradient(135deg, #2D3A1F, #3D4A2F);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .hint-panel.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .hint-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .hint-content {
            color: var(--text);
            font-size: 16px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scratch Pad */
        .scratch-pad {
            margin: 20px 0;
        }

        .scratch-pad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .scratch-pad-title {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .scratch-buttons {
            display: flex;
            gap: 8px;
        }

        .scratch-clear, .scratch-undo {
            background: var(--error);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            touch-action: manipulation;
        }

        .scratch-undo {
            background: var(--primary-light);
        }

        .scratch-canvas {
            width: 100%;
            height: 180px;
            background: var(--scratch-bg);
            border-radius: 12px;
            border: 2px solid var(--scratch-line);
            touch-action: none;
            cursor: crosshair;
        }

        /* Answer Input with S-Pen */
        .answer-input-container {
            margin: 0 auto;
            max-width: 320px;
        }

        .input-mode-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 2px solid var(--scratch-line);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--background);
        }

        .pen-input-area {
            background: var(--scratch-bg);
            border-radius: 12px;
            border: 2px solid var(--scratch-line);
            padding: 12px;
        }

        .pen-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pen-input-label {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .pen-input-buttons {
            display: flex;
            gap: 8px;
        }

        .pen-input-btn {
            background: var(--primary-light);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            touch-action: manipulation;
        }

        .pen-input-btn.clear {
            background: var(--error);
        }

        .pen-input-canvas {
            width: 100%;
            height: 120px;
            background: var(--background);
            border-radius: 8px;
            border: 2px solid var(--accent);
            touch-action: none;
            cursor: crosshair;
        }

        .recognized-answer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 2px solid var(--scratch-line);
        }

        .recognized-label {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .recognized-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            min-width: 60px;
            text-align: center;
        }

        .recognized-value.error {
            color: var(--error-light);
            font-size: 14px;
        }

        .pen-input-submit {
            width: 100%;
            margin-top: 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .pen-input-submit:hover {
            background: var(--success-light);
        }

        /* Numpad */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }

        .numpad-key {
            background: var(--card-bg);
            border: 2px solid var(--scratch-line);
            border-radius: 12px;
            padding: 16px;
            min-height: 64px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .numpad-key:hover, .numpad-key:active {
            background: var(--primary-light);
            border-color: var(--accent);
        }

        .numpad-key.backspace {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }

        .numpad-key.confirm {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .numpad-key.confirm:hover {
            background: var(--success-light);
        }

        .answer-display {
            background: var(--card-bg);
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-display.shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Multiple Choice */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .choice-button {
            background: var(--card-bg);
            border: 3px solid var(--scratch-line);
            border-radius: 12px;
            padding: 20px;
            min-height: 80px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .choice-button:hover {
            border-color: var(--accent);
            background: var(--primary-light);
        }

        .choice-button.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--background);
        }

        .choice-button.correct {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .choice-button.incorrect {
            border-color: var(--error);
            background: var(--error);
            color: white;
        }

        /* Yes/No Buttons */
        .yesno-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .yesno-button {
            padding: 24px;
            min-height: 100px;
            font-size: 28px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .yesno-button.yes {
            background: var(--success);
            color: white;
        }

        .yesno-button.no {
            background: var(--error);
            color: white;
        }

        .yesno-button:hover {
            transform: scale(1.02);
        }

        /* Multi-select */
        .multiselect-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .multiselect-tile {
            background: var(--card-bg);
            border: 3px solid var(--scratch-line);
            border-radius: 12px;
            padding: 16px;
            min-height: 64px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .multiselect-tile.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--background);
        }

        .confirm-button {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            transition: all 0.2s ease;
        }

        .confirm-button:hover {
            background: var(--success-light);
        }

        /* Feedback */
        .feedback {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 700;
            font-size: 20px;
            display: none;
        }

        .feedback.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #1D4A3A, #2D6A4F);
            color: #A7F3D0;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #4A1D2A, #6A2D3F);
            color: #FECACA;
        }

        /* Explanation Panel */
        .explanation-panel {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }

        .explanation-panel.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 18px;
        }

        .explanation-content {
            font-size: 16px;
            line-height: 1.6;
        }

        .next-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .next-button:hover {
            background: var(--accent-light);
        }

        /* Star Burst Animation */
        .star-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }

        .burst-star {
            position: absolute;
            font-size: 32px;
            animation: burstOut 0.8s ease-out forwards;
        }

        @keyframes burstOut {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confettiFall 2s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .end-screen h2 {
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .end-stars {
            font-size: 48px;
            margin: 20px 0;
            letter-spacing: 8px;
        }

        .end-score {
            font-size: 24px;
            margin: 20px 0;
            color: var(--text);
        }

        .end-total-stars {
            font-size: 16px;
            color: var(--accent);
            margin: 10px 0;
        }

        .end-next-unlock {
            font-size: 14px;
            color: var(--text-light);
            margin: 10px 0;
            padding: 10px;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--accent);
        }

        .end-message {
            font-size: 20px;
            color: var(--text-light);
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #2D3A1F, #3D4A2F);
            border-radius: 12px;
        }

        .end-message.special {
            background: linear-gradient(135deg, #1D4A3A, #2D6A4F);
            color: #A7F3D0;
            font-weight: 700;
        }

        .end-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .home-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .home-button:hover {
            background: var(--accent-light);
        }

        .hall-button-end {
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s ease;
        }

        .hall-button-end:hover {
            background: var(--accent);
            color: var(--background);
        }

        /* Back Button */
        .back-button {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            padding: 8px 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            color: var(--accent-light);
        }

        /* Hide screens */
        .screen {
            display: none;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--scratch-line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ====== HALL OF GODS SCREEN ====== */
        .hall-header {
            text-align: center;
            padding: 20px 0;
        }

        .hall-title {
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .hall-subtitle {
            font-size: 24px;
            color: var(--text);
            font-family: 'MedievalSharp', cursive;
        }

        .hall-progress {
            text-align: center;
            margin: 20px 0;
        }

        .hall-progress-text {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        .hall-progress-bar {
            height: 12px;
            background: var(--scratch-line);
            border-radius: 6px;
            overflow: hidden;
            margin: 0 20px;
        }

        .hall-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .hall-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px 0;
            flex: 1;
        }

        .character-card {
            background: var(--card-bg);
            border: 1px solid var(--scratch-line);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .character-card.unlocked {
            border-color: var(--accent);
        }

        .character-card.locked {
            opacity: 0.6;
        }

        .character-card .char-emoji {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .character-card .char-portrait {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            margin-bottom: 8px;
            cursor: pointer;
        }

        .portrait-fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: fadeIn 0.2s ease;
        }

        .portrait-fullscreen-overlay img {
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 16px;
            border: 3px solid var(--accent);
            box-shadow: 0 0 40px rgba(184, 134, 11, 0.5);
        }

        .portrait-fullscreen-name {
            margin-top: 20px;
            font-size: 28px;
            font-family: 'MedievalSharp', cursive;
            color: var(--text);
        }

        .portrait-fullscreen-subtitle {
            margin-top: 8px;
            font-size: 16px;
            color: var(--accent);
        }

        .portrait-fullscreen-hint {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: var(--text-light);
        }

        /* ====== RAGE STOP OVERLAY ====== */
        .rage-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 27, 42, 0.98);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .rage-character {
            font-size: 80px;
            margin-bottom: 20px;
            animation: ragePulse 2s ease infinite;
        }

        @keyframes ragePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .rage-name {
            font-size: 28px;
            font-family: 'MedievalSharp', cursive;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .rage-message {
            font-size: 18px;
            color: var(--text);
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .rage-timer-container {
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
        }

        .rage-timer-text {
            font-size: 14px;
            color: var(--text-light);
            text-align: center;
            margin-bottom: 8px;
        }

        .rage-timer-bar {
            height: 8px;
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
        }

        .rage-timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .rage-button {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .rage-button.active {
            opacity: 1;
            pointer-events: auto;
        }

        .rage-button.active:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        /* ====== TOPIC CARD PROGRESS ====== */
        .topic-progress-container {
            margin-top: 8px;
        }

        .topic-progress-bar {
            height: 6px;
            background: var(--scratch-line);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .topic-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .topic-progress-text {
            font-size: 11px;
            color: var(--text-light);
        }

        .topic-unlock-hint {
            font-size: 12px;
            margin-top: 6px;
            color: var(--accent);
        }

        .topic-card.needs-help {
            border-color: var(--error);
        }

        .topic-help-text {
            font-size: 11px;
            color: var(--error-light);
            margin-top: 4px;
        }

        /* ====== STREAK DISPLAY ====== */
        .streak-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 8px;
            margin-top: 12px;
        }

        .streak-fire {
            font-size: 20px;
        }

        .streak-text {
            font-size: 14px;
            color: var(--accent);
            font-weight: 600;
        }

        /* ====== CHARACTER CARD CONDITION TEXT ====== */
        .char-condition {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 8px;
            line-height: 1.4;
        }

        /* ====== DIFFICULTY LEVEL DISPLAY ====== */
        .topic-difficulty {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .difficulty-runes {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .difficulty-runes.level-3 {
            text-shadow: 0 0 8px rgba(184, 134, 11, 0.6);
            animation: runeGlow 2s ease infinite;
        }

        @keyframes runeGlow {
            0%, 100% { text-shadow: 0 0 8px rgba(184, 134, 11, 0.4); }
            50% { text-shadow: 0 0 12px rgba(184, 134, 11, 0.8); }
        }

        .difficulty-label {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* Level Up Animation */
        .topic-card.level-up {
            animation: levelUpFlash 1s ease;
        }

        @keyframes levelUpFlash {
            0% { box-shadow: 0 0 0 0 rgba(184, 134, 11, 0); }
            30% { box-shadow: 0 0 20px 5px rgba(184, 134, 11, 0.6); border-color: var(--accent); }
            100% { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        }

        .level-up-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--accent);
            color: var(--background);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            z-index: 10;
            animation: levelUpTextAnim 1.5s ease forwards;
            pointer-events: none;
        }

        @keyframes levelUpTextAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
        }

        .character-card .char-name {
            font-size: 18px;
            font-family: 'MedievalSharp', cursive;
            color: var(--text);
            margin-bottom: 4px;
        }

        .character-card .char-rune {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .character-card .char-subtitle {
            font-size: 12px;
            color: var(--text-light);
        }

        .character-card .lock-icon {
            font-size: 32px;
            opacity: 0.5;
        }

        .character-card .lock-text {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
        }

        .item-badge {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-badge:hover {
            background: var(--accent);
            color: var(--background);
        }

        .item-badge.locked {
            opacity: 0.4;
            cursor: default;
        }

        /* ====== UNLOCK ANIMATION OVERLAY ====== */
        .unlock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.95);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .unlock-sparks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            animation: sparkFall 2s ease-out infinite;
        }

        @keyframes sparkFall {
            0% { transform: translateY(-20px) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0); opacity: 0; }
        }

        .unlock-content {
            text-align: center;
            z-index: 1;
            padding: 20px;
        }

        .unlock-label {
            font-size: 16px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-family: 'MedievalSharp', cursive;
        }

        .unlock-emoji {
            font-size: 80px;
            animation: pulseScale 1s ease infinite;
        }

        @keyframes pulseScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .unlock-name {
            font-size: 32px;
            color: var(--text);
            font-family: 'MedievalSharp', cursive;
            margin: 20px 0 8px;
        }

        .unlock-rune {
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 3px;
            margin-bottom: 16px;
        }

        .unlock-description {
            font-size: 16px;
            color: var(--text-light);
            max-width: 300px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        .unlock-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .unlock-btn-hall {
            background: var(--accent);
            color: var(--background);
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .unlock-btn-continue {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--text-light);
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        /* ====== 3D VIEWER OVERLAY ====== */
        .viewer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            z-index: 3000;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--surface);
        }

        .viewer-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        .viewer-title {
            font-family: 'MedievalSharp', cursive;
            color: var(--accent);
            font-size: 20px;
        }

        .viewer-canvas-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-canvas-container canvas {
            width: 100%;
            height: 100%;
        }

        .viewer-fallback {
            text-align: center;
            padding: 40px;
        }

        .viewer-fallback-emoji {
            font-size: 120px;
            margin-bottom: 20px;
        }

        .viewer-fallback-name {
            font-size: 24px;
            font-family: 'MedievalSharp', cursive;
            color: var(--text);
            margin-bottom: 8px;
        }

        .viewer-fallback-desc {
            font-size: 14px;
            color: var(--text-light);
            max-width: 280px;
            margin: 0 auto;
        }

        .viewer-info {
            padding: 20px;
            background: var(--surface);
            text-align: center;
        }

        .viewer-info-name {
            font-size: 20px;
            font-family: 'MedievalSharp', cursive;
            color: var(--text);
            margin-bottom: 4px;
        }

        .viewer-info-rune {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .viewer-info-desc {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
        }
    </style>
</head>

    <div class="container">
        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <div class="header">
                <h1>Mathe-Champion</h1>
                <p class="subtitle">Die Halle der Götter</p>
                <p class="rune-subtitle">ᚼᛅᛚᛚ ᚢᚠ ᚴᚢᚦᛋ</p>

                <!-- Yggdrasil SVG Banner -->
                <svg class="yggdrasil-banner" viewBox="0 0 100 75" fill="none">
                    <path d="M50 70 L50 35 M50 35 C35 35 25 20 25 10 M50 35 C65 35 75 20 75 10 M50 35 C50 25 40 15 30 15 M50 35 C50 25 60 15 70 15 M50 50 C35 55 20 50 15 45 M50 50 C65 55 80 50 85 45 M45 70 C40 72 35 70 30 68 M55 70 C60 72 65 70 70 68"
                          stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="50" cy="8" r="4" fill="#B8860B" opacity="0.5"/>
                    <circle cx="25" cy="8" r="3" fill="#B8860B" opacity="0.3"/>
                    <circle cx="75" cy="8" r="3" fill="#B8860B" opacity="0.3"/>
                </svg>

                <div class="prophecy-box">
                    <div class="prophecy-title">⚡ Die Prüfung naht...</div>
                    <div class="countdown" id="countdown"></div>
                </div>
            </div>

            <div class="topic-grid" id="topic-grid"></div>

    <script>
        // Capacitor Preferences wrapper with localStorage fallback
        const Storage = {
            async get(key) {
                try {
                    // Check if Capacitor Preferences plugin is available
                    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
                        const result = await window.Capacitor.Plugins.Preferences.get({ key });
                        return result.value;
                    }
                } catch (e) {
                    console.log('Capacitor Preferences not available, using localStorage');
                }
                return localStorage.getItem(key);
            },
            async set(key, value) {
                try {
                    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
                        await window.Capacitor.Plugins.Preferences.set({ key, value });
                        return;
                    }
                } catch (e) {
                    console.log('Capacitor Preferences not available, using localStorage');
                }
                localStorage.setItem(key, value);
            }
        };

        // Make Storage globally available
        window.Storage = Storage;

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>

        async function loadProgress() {

                    await window.Storage.set('norseUnlocks', JSON.stringify(state.unlockedIds));
                } else {
                    state.unlockedIds = JSON.parse(savedUnlocks);
                    // Ensure legacy unlocks are always present
                    let updated = false;
                    for (const id of LEGACY_UNLOCKED_IDS) {
                        if (!state.unlockedIds.includes(id)) {
                            state.unlockedIds.push(id);
                            updated = true;
                        }
                    }
                    if (updated) {
                        await window.Storage.set('norseUnlocks', JSON.stringify(state.unlockedIds));
                    }
                }

                // Load topic performance
                const savedPerformance = await window.Storage.get('topicPerformance');
                if (savedPerformance) {
                    state.topicPerformance = JSON.parse(savedPerformance);
                }

                // Load exam high scores
                const savedExamScores = await window.Storage.get('examHighScores');
                if (savedExamScores) {
                    state.examHighScores = JSON.parse(savedExamScores);

        // ====== PERFORMANCE TRACKING FUNCTIONS ======
        function getTopicScore(topicId) {
            const perf = state.topicPerformance[topicId];
            if (!perf || perf.sessions < 3 || perf.totalQuestions === 0) {
                return 0;
            }
            return Math.round((perf.totalCorrect / perf.totalQuestions) * 100);
        }

        function getTopicSessionCount(topicId) {
            const perf = state.topicPerformance[topicId];
            return perf ? perf.sessions : 0;
        }

        function getOverallAverage() {
            let totalScore = 0;
            let countedTopics = 0;
            for (const topic of topics) {
                const score = getTopicScore(topic.id);
                if (score > 0) {
                    totalScore += score;
                    countedTopics++;
                }
            }
            return countedTopics > 0 ? Math.round(totalScore / countedTopics) : 0;
        }

        // ====== SPACED REPETITION FUNCTIONS ======
        function getDaysSinceLastPlay(topicId) {
            const perf = state.topicPerformance[topicId];
            if (!perf || !perf.lastPlayedDate) return 999; // Never played = high priority

            const lastPlayed = new Date(perf.lastPlayedDate);
            const today = new Date();
            const diffTime = today - lastPlayed;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function wasWeakInLastExam(topicId) {
            return state.lastExamWeakTopics.includes(topicId);
        }

        function calculateTopicPriority(topicId) {
            const performance = getTopicScore(topicId);
            const daysSinceLastPlay = getDaysSinceLastPlay(topicId);
            const examWeakness = wasWeakInLastExam(topicId);

            let priority = 0;

            // Performance-based priority
            if (performance < 60) priority += 50;
            else if (performance < 75) priority += 30;
            else if (performance < 85) priority += 10;

            // Time-based priority
            if (daysSinceLastPlay > 2) priority += 20;
            else if (daysSinceLastPlay > 1) priority += 10;

            // Exam weakness priority
            if (examWeakness) priority += 30;

            return priority;
        }

        function getBestExamScore() {
            const scores = Object.values(state.examHighScores);
            return scores.length > 0 ? Math.max(...scores) : 0;
        }

        function checkAllTopicsPlayed() {
            for (const topic of topics) {
                const perf = state.topicPerformance[topic.id];
                if (!perf || !perf.played) {
                    return false;
                }
            }
            return true;
        }

        function checkCondition(unlock) {
            if (!unlock.condition) return false;

            switch (unlock.condition.type) {
                case 'topic_performance': {
                    const requiredTopics = unlock.condition.topics;
                    const threshold = unlock.condition.threshold;
                    let totalScore = 0;
                    let validTopics = 0;

                    for (const topicId of requiredTopics) {
                        const sessions = getTopicSessionCount(topicId);
                        if (sessions < 3) return false; // Must have played at least 3 times
                        const score = getTopicScore(topicId);
                        totalScore += score;
                        validTopics++;
                    }

                    if (validTopics === 0) return false;
                    const avgScore = totalScore / validTopics;
                    return avgScore >= threshold;
                }

                case 'overall_average': {
                    // All topics must be played at least once
                    for (const topic of topics) {
                        if (getTopicSessionCount(topic.id) < 3) return false;
                    }
                    return getOverallAverage() >= unlock.condition.threshold;
                }

                case 'streak': {
                    return state.streakCount >= unlock.condition.count;
                }

                case 'all_topics_played': {
                    return state.allTopicsPlayedOnce;
                }

                case 'exam_score': {
                    return getBestExamScore() >= unlock.condition.threshold;
                }

                default:
                    return false;
            }
        }

        function getConditionText(unlock) {
            if (!unlock.condition) return '';

            switch (unlock.condition.type) {
                case 'topic_performance': {
                    const topicNames = unlock.condition.topics.map(id => {
                        const t = topics.find(top => top.id === id);
                        return t ? t.name : id;
                    }).join(' & ');
                    return `${topicNames} auf ${unlock.condition.threshold}% bringen`;
                }
                case 'overall_average':
                    return `Gesamtdurchschnitt von ${unlock.condition.threshold}% erreichen`;
                case 'streak':
                    return `${unlock.condition.count} perfekte Sessions in Folge`;
                case 'all_topics_played':
                    return 'Alle Themen mindestens einmal spielen';
                case 'exam_score':
                    return `${unlock.condition.threshold}% im Prüfungsmodus erreichen`;
                default:
                    return '';
            }
        }

        // ====== DIFFICULTY SYSTEM ======
        function getDifficultyLevel(topicId) {
            if (!state.topicDifficulty[topicId]) {
                state.topicDifficulty[topicId] = { level: 1, sessionsAtLevel: 0 };
            }
            return state.topicDifficulty[topicId].level;

                case 2: return 'Mittel';
                case 3: return 'Schwer';

            }

        function getDifficultyRunes(level) {

        async function adjustDifficulty(topicId, sessionScore) {
            // Initialize if needed
            if (!state.topicDifficulty[topicId]) {
                state.topicDifficulty[topicId] = { level: 1, sessionsAtLevel: 0 };
            }

            // Get recent scores from topicPerformance
            const perf = state.topicPerformance[topicId];
            if (!perf || !perf.recentScores || perf.recentScores.length < 2) {
                return false; // Need at least 2 sessions to adjust
            }

            const recentScores = perf.recentScores;
            const currentLevel = state.topicDifficulty[topicId].level;
            let levelChanged = false;
            let levelUp = false;

            // Check for level UP: Last 2 sessions both > 85% AND level < 3
            if (currentLevel < 3 && recentScores.length >= 2) {
                if (recentScores[0] > 85 && recentScores[1] > 85) {
                    state.topicDifficulty[topicId].level = currentLevel + 1;
                    state.topicDifficulty[topicId].sessionsAtLevel = 0;
                    levelChanged = true;
                    levelUp = true;
                }
            }

            // Check for level DOWN: Last 2 sessions both < 50% AND level > 1
            if (!levelChanged && currentLevel > 1 && recentScores.length >= 2) {
                if (recentScores[0] < 50 && recentScores[1] < 50) {
                    state.topicDifficulty[topicId].level = currentLevel - 1;
                    state.topicDifficulty[topicId].sessionsAtLevel = 0;
                    levelChanged = true;
                    levelUp = false;
                }
            }

            if (levelChanged) {
                await saveProgress();
                // Only show animation for level UP (level down is silent)
                if (levelUp) {
                    showLevelUpAnimation(topicId);
                }
            }

            return levelChanged;
        }

                    card.appendChild(textEl);
                    setTimeout(() => {
                        card.classList.remove('level-up');
                        textEl.remove();

            });

        // ====== RENDERING ======
        function renderTopicGrid() {
            const grid = document.getElementById('topic-grid');

            // Calculate priorities and sort topics
            const topicsWithPriority = topics.map(topic => ({
                topic,
                priority: calculateTopicPriority(topic.id)
            }));
            topicsWithPriority.sort((a, b) => b.priority - a.priority);

            // Get top 2 priority topics for "Recommended" badge
            const topPriorityIds = topicsWithPriority
                .filter(t => t.priority > 0)
                .slice(0, 2)
                .map(t => t.topic.id);

            grid.innerHTML = topicsWithPriority.map(({ topic, priority }) => {
                const rune = TOPIC_RUNES[topic.id] || 'ᚱ';
                const sessions = getTopicSessionCount(topic.id);
                const score = getTopicScore(topic.id);
                const diffLevel = getDifficultyLevel(topic.id);
                const needsHelp = sessions >= 3 && score < 60 && diffLevel === 1;
                const nextUnlock = getNextUnlockForTopic(topic.id);
                const isHighlightWeak = state.highlightWeakTopics.includes(topic.id);
                const isRecommended = topPriorityIds.includes(topic.id) && !isHighlightWeak;

                let progressText = '';
                if (sessions < 3) {
                    progressText = `Noch ${3 - sessions} Session${3 - sessions !== 1 ? 's' : ''} bis Wertung`;
                } else {
                    progressText = `${score}% Durchschnitt`;
                }

                let unlockHint = '';
                if (nextUnlock) {
                    unlockHint = `<div class="topic-unlock-hint">${nextUnlock.emoji} ${nextUnlock.name} wartet!</div>`;
                }

                let helpText = '';
                if (needsHelp) {
                    const charId = TOPIC_CHARACTER_MAP[topic.id];
                    const char = NORSE_UNLOCKS.find(u => u.id === charId);
                    if (char) {
                        helpText = `<div class="topic-help-text">${char.emoji} ${char.name} braucht deine Hilfe!</div>`;
                    }
                }

                // Badge for highlighted weak topics or recommended
                let badgeHTML = '';
                if (isHighlightWeak) {
                    badgeHTML = `<div class="topic-badge">🎯 Jetzt üben!</div>`;
                } else if (isRecommended) {
                    badgeHTML = `<div class="topic-badge recommended">🎯 Empfohlen</div>`;
                }

                const diffRunes = getDifficultyRunes(diffLevel);
                const diffLabel = getDifficultyLabel(diffLevel);

                const cardClasses = [
                    'topic-card',
                    needsHelp ? 'needs-help' : '',
                    isHighlightWeak ? 'highlight-weak' : ''
                ].filter(Boolean).join(' ');

                return `
                    <div class="${cardClasses}" onclick="startTopic('${topic.id}')" data-topic="${topic.id}">
                        ${badgeHTML}
                        <div class="topic-rune">${rune}</div>
                        <div class="topic-name">${topic.name}</div>
                        <div class="topic-lang">${topic.lang === 'de' ? '🇩🇪' : '🇬🇧'}</div>
                        <div class="topic-progress-container">
                            <div class="topic-progress-bar">
                                <div class="topic-progress-fill" style="width: ${Math.min(score, 100)}%"></div>
                            </div>
                            <div class="topic-progress-text">${progressText}</div>
                        </div>
                        ${unlockHint}
                        ${helpText}
                        <div class="topic-difficulty">
                            <span class="difficulty-runes ${diffLevel === 3 ? 'level-3' : ''}">${diffRunes}</span>
                            <span class="difficulty-label">${diffLabel}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
